<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <!-- Favicon & PWA Icons -->
    <link rel="icon" type="image/png" sizes="192x192" href="../assets/icon-192.png">
    <link rel="icon" type="image/webp" href="../assets/logo-primary.webp">
    <link rel="apple-touch-icon" sizes="180x180" href="../assets/apple-touch-icon.png">
    <link rel="manifest" href="../manifest.json">
    <meta name="theme-color" content="#0059b5">
    <meta name="mobile-web-app-capable" content="yes">
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="description" content="Sign in to Garment OS — Manufacturing Operating System"/>
    <title>Sign In — U x S Garment OS</title>

    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com" rel="preconnect"/>
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>

    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script src="../js/tailwind.config.js"></script>

    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/typography.css">
    <link rel="stylesheet" href="../css/utilities.css">

    <style>
        .input-group-modern {
            position: relative;
            display: flex;
            align-items: center;
            width: 100%;
        }

        .input-modern {
            width: 100%;
            background: #FFFFFF !important;
            border: 1.5px solid #E2E8F0 !important;
            border-radius: 16px !important;
            padding-top: 14px !important;
            padding-bottom: 14px !important;
            padding-left: 44px !important;
            padding-right: 16px !important;
            font-size: 15px !important;
            font-weight: 500 !important;
            color: #0F172A !important;
            outline: none !important;
            transition: all 150ms ease;
        }

        .input-modern:focus {
            border-color: #0059B5 !important;
            box-shadow: 0 0 0 3px rgba(0, 89, 181, 0.12) !important;
        }

        .input-modern::placeholder { color: #94A3B8; font-weight: 400; }

        .brand-badge {
            background: linear-gradient(135deg, #0059B5 0%, #0071E3 100%);
            box-shadow: 0 8px 20px rgba(0, 89, 181, 0.25);
        }
    </style>
</head>
<body class="font-body text-body antialiased">

    <div class="mobile-wrapper min-h-screen flex flex-col justify-center px-6 py-8 !pt-8 !pb-8">

        <!-- App Header & Brand Mark -->
        <div class="flex flex-col items-center text-center mb-8">
            <div class="brand-badge w-14 h-14 rounded-2xl flex items-center justify-center mb-4">
                <span class="material-symbols-outlined text-white text-[28px]" style="font-variation-settings:'FILL' 1;">precision_manufacturing</span>
            </div>
            <h1 class="text-[26px] font-bold text-on-surface tracking-tight">Garment OS</h1>
            <p class="text-[14px] text-secondary mt-1">Manufacturing Operating System</p>
        </div>

        <!-- Auth Form Card -->
        <div class="bg-surface-container-lowest rounded-[28px] border border-outline-variant/60 p-6 sm:p-7 shadow-sm">
            <div class="mb-6">
                <h2 class="text-[20px] font-semibold text-on-surface">Welcome Back</h2>
                <p class="text-[13px] text-secondary mt-0.5">Please sign in to continue</p>
            </div>

            <form onsubmit="handleLogin(event)" novalidate class="flex flex-col gap-4">

                <!-- Username Field -->
                <div class="flex flex-col gap-1.5">
                    <label class="text-[12px] font-semibold text-on-surface-variant uppercase tracking-wider">Username</label>
                    <div class="input-group-modern">
                        <span class="material-symbols-outlined absolute left-3.5 text-secondary text-[20px] pointer-events-none">person</span>
                        <input id="email" type="text" class="input-modern" placeholder="Enter username" autocomplete="username" required/>
                    </div>
                    <p id="email-error" class="text-[12px] text-error hidden mt-0.5 font-medium">Please enter your username.</p>
                </div>

                <!-- Password Field -->
                <div class="flex flex-col gap-1.5">
                    <label class="text-[12px] font-semibold text-on-surface-variant uppercase tracking-wider">Password</label>
                    <div class="input-group-modern relative">
                        <span class="material-symbols-outlined absolute left-3.5 text-secondary text-[20px] pointer-events-none">lock</span>
                        <input id="password" type="password" class="input-modern !pr-11" placeholder="Enter password" autocomplete="current-password" required/>
                        <button type="button" onclick="togglePassword()" class="absolute right-3.5 text-secondary hover:text-on-surface transition-colors">
                            <span id="pw-eye" class="material-symbols-outlined text-[20px]">visibility</span>
                        </button>
                    </div>
                    <p id="password-error" class="text-[12px] text-error hidden mt-0.5 font-medium">Password is required.</p>
                </div>

                <!-- Session Checkbox -->
                <div class="flex items-center justify-between py-1">
                    <label class="flex items-center gap-2.5 cursor-pointer">
                        <input type="checkbox" class="w-4 h-4 rounded border-outline-variant text-primary focus:ring-primary/20 transition-all cursor-pointer" id="remember-me" checked/>
                        <span class="text-[13px] text-on-surface">Keep me signed in <span class="text-secondary text-[12px]">(1 hr)</span></span>
                    </label>
                </div>

                <!-- Submit Button -->
                <button type="submit" id="submit-btn" class="w-full bg-primary text-white text-[15px] font-semibold rounded-2xl py-3.5 mt-2 hover:bg-primary/90 active:scale-[0.98] transition-all shadow-sm flex items-center justify-center gap-2">
                    <span>Sign In</span>
                    <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
                </button>

                <!-- Error Alert -->
                <div id="login-error" class="hidden rounded-xl bg-error-container border border-error/20 p-3.5 flex items-center gap-2.5 mt-1">
                    <span class="material-symbols-outlined text-error text-[20px] shrink-0">error</span>
                    <span id="login-error-msg" class="text-[13px] text-error font-medium leading-snug">Invalid username or password. Please try again.</span>
                </div>

            </form>

          
        </div>

        <!-- Footer Info -->
        <p class="text-center text-[12px] text-secondary mt-8">
            U x S Garment OS • Secure Cloud Engine v1.0
        </p>

    </div>

    <script>
        // Detect API endpoint based on environment
        function getAPIBase() {
            const hostname = window.location.hostname;
            
            // Development environments
            if (hostname === 'localhost' || hostname === '127.0.0.1') {
                return 'http://localhost:8787';
            }
            
            // Production: check if API is on same domain or different
            const protocol = window.location.protocol; // https: or http:
            const port = window.location.port ? `:${window.location.port}` : '';
            
            // Try: api.yourdomain.com, api-yourdomain.com, yourdomain.com/api, etc.
            // For now, assume same domain
            return `${protocol}//${hostname}${port}`;
        }
        
        const API_BASE = getAPIBase();
        
        // Debug: log API endpoint (remove in production)
        console.log('API Base:', API_BASE);

        function togglePassword() {
            const pw = document.getElementById('password');
            const eye = document.getElementById('pw-eye');
            if (pw.type === 'password') {
                pw.type = 'text';
                eye.textContent = 'visibility_off';
            } else {
                pw.type = 'password';
                eye.textContent = 'visibility';
            }
        }

        async function handleLogin(e) {
            e.preventDefault();
            const username = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const emailError = document.getElementById('email-error');
            const pwError = document.getElementById('password-error');
            const loginError = document.getElementById('login-error');
            const loginErrorMsg = document.getElementById('login-error-msg');
            const btn = document.getElementById('submit-btn');

            let valid = true;
            emailError.classList.add('hidden');
            pwError.classList.add('hidden');
            loginError.classList.add('hidden');

            if (!username) {
                emailError.classList.remove('hidden');
                valid = false;
            }
            if (!password) {
                pwError.classList.remove('hidden');
                valid = false;
            }
            if (!valid) return;

            // Loading state
            btn.innerHTML = '<span class="material-symbols-outlined animate-spin text-[18px]">progress_activity</span> <span>Authenticating…</span>';
            btn.disabled = true;
            btn.style.opacity = '0.8';

            try {
                const loginUrl = `${API_BASE}/api/auth/login`;
                console.log('Attempting login at:', loginUrl);
                
                const response = await fetch(loginUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (!response.ok || data.error) {
                    throw new Error(data.error || 'Authentication failed');
                }

                if (data.token) {
                    localStorage.setItem('gos_token', data.token);
                    window.location.href = '../pages/dashboard.html';
                }
            } catch (err) {
                console.error('Login error:', err);
                loginErrorMsg.textContent = err.message || 'Failed to connect. Please check the API endpoint.';
                loginError.classList.remove('hidden');
                btn.innerHTML = '<span>Sign In</span><span class="material-symbols-outlined text-[18px]">arrow_forward</span>';
                btn.disabled = false;
                btn.style.opacity = '1';
            }
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Favicon & PWA Icons -->
    <link rel="icon" type="image/png" sizes="192x192" href="../assets/icon-192.png">
    <link rel="icon" type="image/webp" href="../assets/logo-primary.webp">
    <link rel="apple-touch-icon" sizes="180x180" href="../assets/apple-touch-icon.png">
    <link rel="manifest" href="../manifest.json">
    <meta name="theme-color" content="#0059b5">
    <meta name="mobile-web-app-capable" content="yes">
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="description" content="Sign in to Garment OS — Manufacturing Operating System"/>
    <title>Sign In — U x S Garment OS</title>

    <!-- Zero-Flicker Dark Mode Theme Resolver & Global Handler -->
    <script>
      (function() {
        if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
        window.toggleTheme = window.toggleTheme || function() {
          const isDark = document.documentElement.classList.toggle('dark');
          localStorage.setItem('theme', isDark ? 'dark' : 'light');
          if (typeof window.updateThemeToggleUI === 'function') {
            window.updateThemeToggleUI(isDark);
          }
          window.dispatchEvent(new CustomEvent('gos-theme-changed', { detail: { isDark } }));
        };
      })();
    </script>

    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com" rel="preconnect"/>
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>

    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script src="../js/tailwind.config.js"></script>

    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/typography.css">
    <link rel="stylesheet" href="../css/utilities.css">

    <style>
        .input-group-modern {
            position: relative;
            display: flex;
            align-items: center;
            width: 100%;
        }

        .input-modern {
            width: 100%;
            background: #FFFFFF !important;
            border: 1.5px solid #E2E8F0 !important;
            border-radius: 16px !important;
            padding-top: 14px !important;
            padding-bottom: 14px !important;
            padding-left: 44px !important;
            padding-right: 16px !important;
            font-size: 15px !important;
            font-weight: 500 !important;
            color: #0F172A !important;
            outline: none !important;
            transition: all 150ms ease;
        }

        .dark .input-modern {
            background: #1e293b !important;
            border-color: #334155 !important;
            color: #f8fafc !important;
        }

        .input-modern:focus {
            border-color: #0059B5 !important;
            box-shadow: 0 0 0 3px rgba(0, 89, 181, 0.12) !important;
        }

        .dark .input-modern:focus {
            border-color: #38bdf8 !important;
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2) !important;
        }

        .input-modern::placeholder { color: #94A3B8; font-weight: 400; }
        .dark .input-modern::placeholder { color: #64748b; }

        .brand-badge {
            background: linear-gradient(135deg, #0059B5 0%, #0071E3 100%);
            box-shadow: 0 8px 20px rgba(0, 89, 181, 0.25);
        }

        .biometric-btn {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 13px 20px;
            border-radius: 18px;
            border: 1.5px solid #E2E8F0;
            background: #F8FAFF;
            color: #0059B5;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 180ms ease;
            -webkit-tap-highlight-color: transparent;
        }
        .dark .biometric-btn {
            background: #1e293b;
            border-color: #334155;
            color: #38bdf8;
        }
        .biometric-btn:hover {
            background: #EEF4FF;
            border-color: #0059B5;
            box-shadow: 0 0 0 3px rgba(0,89,181,0.10);
        }
        .dark .biometric-btn:hover {
            background: #334155;
            border-color: #38bdf8;
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
        }
        .biometric-btn:active { transform: scale(0.97); }
        .biometric-btn:disabled { opacity: 0.55; cursor: not-allowed; transform: none; }

        .or-divider {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #94A3B8;
            font-size: 12px;
            font-weight: 500;
            letter-spacing: 0.05em;
            margin: 2px 0;
        }
        .dark .or-divider { color: #64748b; }
        .or-divider::before, .or-divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #E2E8F0;
        }
        .dark .or-divider::before, .dark .or-divider::after {
            background: #334155;
        }
    </style>
</head>
<body class="font-body text-body antialiased bg-[#F5F5F7] dark:bg-slate-950 text-on-surface dark:text-slate-100 min-h-screen">

    <!-- Top Theme Toggle -->
    <div class="fixed top-4 right-4 z-50">
        <button type="button" onclick="toggleTheme()" class="theme-toggle-btn w-10 h-10 rounded-full bg-white dark:bg-slate-800 shadow-sm border border-outline-variant/40 dark:border-slate-700 flex items-center justify-center text-secondary dark:text-slate-300 hover:bg-surface-variant/50 transition-all" aria-label="Toggle theme" title="Toggle theme">
            <span class="material-symbols-outlined text-[20px]">dark_mode</span>
        </button>
    </div>

    <div class="mobile-wrapper min-h-screen flex flex-col justify-center px-6 py-8 !pt-8 !pb-8">

        <!-- App Header & Brand Mark -->
        <div class="flex flex-col items-center text-center mb-8">
            <div class="brand-badge w-14 h-14 rounded-2xl flex items-center justify-center mb-4">
                <span class="material-symbols-outlined text-white text-[28px]" style="font-variation-settings:'FILL' 1;">precision_manufacturing</span>
            </div>
            <h1 class="text-[26px] font-bold text-on-surface dark:text-slate-100 tracking-tight">Garment OS</h1>
            <p class="text-[14px] text-secondary dark:text-slate-400 mt-1">Manufacturing Operating System</p>
        </div>

        <!-- Auth Form Card -->
        <div class="bg-surface-container-lowest dark:bg-slate-900 rounded-[28px] border border-outline-variant/60 dark:border-slate-800 p-6 sm:p-7 shadow-sm">
            <div class="mb-6">
                <h2 class="text-[20px] font-semibold text-on-surface dark:text-slate-100">Welcome Back</h2>
                <p class="text-[13px] text-secondary dark:text-slate-400 mt-0.5">Please sign in to continue</p>
            </div>

            <form onsubmit="handleLogin(event)" novalidate class="flex flex-col gap-4">

                <!-- Username Field -->
                <div class="flex flex-col gap-1.5">
                    <label class="text-[12px] font-semibold text-on-surface-variant dark:text-slate-300 uppercase tracking-wider">Username</label>
                    <div class="input-group-modern">
                        <span class="material-symbols-outlined absolute left-3.5 text-secondary dark:text-slate-400 text-[20px] pointer-events-none">person</span>
                        <input id="email" type="text" class="input-modern" placeholder="Enter username" autocomplete="username" required/>
                    </div>
                    <p id="email-error" class="text-[12px] text-error hidden mt-0.5 font-medium">Please enter your username.</p>
                </div>

                <!-- Password Field -->
                <div class="flex flex-col gap-1.5">
                    <label class="text-[12px] font-semibold text-on-surface-variant dark:text-slate-300 uppercase tracking-wider">Password</label>
                    <div class="input-group-modern relative">
                        <span class="material-symbols-outlined absolute left-3.5 text-secondary dark:text-slate-400 text-[20px] pointer-events-none">lock</span>
                        <input id="password" type="password" class="input-modern !pr-11" placeholder="Enter password" autocomplete="current-password" required/>
                        <button type="button" onclick="togglePassword()" class="absolute right-3.5 text-secondary dark:text-slate-400 hover:text-on-surface dark:hover:text-slate-100 transition-colors">
                            <span id="pw-eye" class="material-symbols-outlined text-[20px]">visibility</span>
                        </button>
                    </div>
                    <p id="password-error" class="text-[12px] text-error hidden mt-0.5 font-medium">Password is required.</p>
                </div>

                <!-- Session Checkbox -->
                <div class="flex items-center justify-between py-1">
                    <label class="flex items-center gap-2.5 cursor-pointer">
                        <input type="checkbox" class="w-4 h-4 rounded border-outline-variant dark:border-slate-700 bg-white dark:bg-slate-800 text-primary focus:ring-primary/20 transition-all cursor-pointer" id="remember-me" checked/>
                        <span class="text-[13px] text-on-surface dark:text-slate-300">Keep me signed in <span class="text-secondary dark:text-slate-400 text-[12px]">(1 hr)</span></span>
                    </label>
                </div>

                <!-- Submit Button -->
                <button type="submit" id="submit-btn" class="w-full bg-primary text-white text-[15px] font-semibold rounded-2xl py-3.5 mt-2 hover:bg-primary/90 active:scale-[0.98] transition-all shadow-sm flex items-center justify-center gap-2">
                    <span>Sign In</span>
                    <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
                </button>

                <!-- Error Alert -->
                <div id="login-error" class="hidden rounded-xl bg-error-container dark:bg-red-950/40 border border-error/20 dark:border-red-800/40 p-3.5 flex items-center gap-2.5 mt-1">
                    <span class="material-symbols-outlined text-error text-[20px] shrink-0">error</span>
                    <span id="login-error-msg" class="text-[13px] text-error font-medium leading-snug">Invalid username or password. Please try again.</span>
                </div>

            </form>

            <!-- Biometric Login Section -->
            <div id="biometric-section" class="hidden mt-4">
                <div class="or-divider">or</div>
                <button id="biometric-btn" onclick="loginWithBiometric()" class="biometric-btn mt-3">
                    <span class="material-symbols-outlined text-[22px]" style="font-variation-settings:'FILL' 1;">fingerprint</span>
                    <span id="biometric-btn-text">Sign in with Biometrics</span>
                </button>
                <div id="biometric-error" class="hidden rounded-xl bg-error-container dark:bg-red-950/40 border border-error/20 dark:border-red-800/40 p-3 flex items-center gap-2 mt-2">
                    <span class="material-symbols-outlined text-error text-[18px] shrink-0">error</span>
                    <span id="biometric-error-msg" class="text-[12px] text-error font-medium leading-snug"></span>
                </div>
            </div>

          
        </div>

        <!-- Footer Info -->
        <p class="text-center text-[12px] text-secondary dark:text-slate-500 mt-8">
            U x S Garment OS • Secure Cloud Engine v1.0
        </p>

    </div>

    <script>
        // Detect API endpoint based on environment
        function getAPIBase() {
            // When served via Cloudflare Workers or local dev server (wrangler dev), use relative paths
            const port = window.location.port;
            if (port === '8787' || port === '8788' || window.location.hostname.includes('garment-os')) {
                return '';
            }
            return '';
        }
        
        const API_BASE = getAPIBase();
        console.log('API Base:', API_BASE);

        // ── WebAuthn / Biometric Support Detection ────────────────────
        (async function detectBiometric() {
            try {
                if (!window.PublicKeyCredential) return;
                const available = await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable();
                if (available) {
                    document.getElementById('biometric-section').classList.remove('hidden');
                }
            } catch (e) { /* not supported, keep hidden */ }
        })();

        function togglePassword() {
            const pw = document.getElementById('password');
            const eye = document.getElementById('pw-eye');
            if (pw.type === 'password') {
                pw.type = 'text';
                eye.textContent = 'visibility_off';
            } else {
                pw.type = 'password';
                eye.textContent = 'visibility';
            }
        }

        async function handleLogin(e) {
            e.preventDefault();
            const username = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const emailError = document.getElementById('email-error');
            const pwError = document.getElementById('password-error');
            const loginError = document.getElementById('login-error');
            const loginErrorMsg = document.getElementById('login-error-msg');
            const btn = document.getElementById('submit-btn');

            let valid = true;
            emailError.classList.add('hidden');
            pwError.classList.add('hidden');
            loginError.classList.add('hidden');

            if (!username) { emailError.classList.remove('hidden'); valid = false; }
            if (!password) { pwError.classList.remove('hidden'); valid = false; }
            if (!valid) return;

            btn.innerHTML = '<span class="material-symbols-outlined animate-spin text-[18px]">progress_activity</span> <span>Authenticating…</span>';
            btn.disabled = true;
            btn.style.opacity = '0.8';

            try {
                const response = await fetch(`${API_BASE}/api/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await response.json();
                if (!response.ok || data.error) throw new Error(data.error || 'Authentication failed');
                if (data.token) {
                    localStorage.setItem('gos_token', data.token);
                    window.location.href = '../pages/dashboard.html';
                }
            } catch (err) {
                console.error('Login error:', err);
                loginErrorMsg.textContent = err.message || 'Failed to connect. Please check the API endpoint.';
                loginError.classList.remove('hidden');
                btn.innerHTML = '<span>Sign In</span><span class="material-symbols-outlined text-[18px]">arrow_forward</span>';
                btn.disabled = false;
                btn.style.opacity = '1';
            }
        }

        // ── Biometric / WebAuthn Login Flow ───────────────────────────
        async function loginWithBiometric() {
            const btn = document.getElementById('biometric-btn');
            const btnText = document.getElementById('biometric-btn-text');
            const errBox = document.getElementById('biometric-error');
            const errMsg = document.getElementById('biometric-error-msg');

            errBox.classList.add('hidden');
            btn.disabled = true;
            btnText.textContent = 'Waiting for biometric…';

            const showError = (msg) => {
                errMsg.textContent = msg;
                errBox.classList.remove('hidden');
                btn.disabled = false;
                btnText.textContent = 'Sign in with Biometrics';
            };

            try {
                // Step 1: Get challenge from server
                const beginRes = await fetch(`${API_BASE}/api/auth/webauthn/login-begin`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({})
                });
                const beginData = await beginRes.json();
                if (!beginRes.ok || beginData.error) throw new Error(beginData.error || 'Could not start biometric login');

                // Step 2: Build PublicKeyCredentialRequestOptions
                const b64ToBuffer = (b64) => {
                    const bin = atob(b64.replace(/-/g,'+').replace(/_/g,'/'));
                    return Uint8Array.from(bin, c => c.charCodeAt(0)).buffer;
                };
                const bufToB64 = (buf) => {
                    return btoa(String.fromCharCode(...new Uint8Array(buf)))
                        .replace(/\+/g,'-').replace(/\//g,'_').replace(/=/g,'');
                };

                const credRequestOptions = {
                    publicKey: {
                        challenge: b64ToBuffer(beginData.challenge),
                        rpId: beginData.rpId,
                        allowCredentials: beginData.allowCredentials.map(c => ({
                            type: 'public-key',
                            id: b64ToBuffer(c.id)
                        })),
                        userVerification: 'required',
                        timeout: beginData.timeout
                    }
                };

                // Step 3: Prompt device biometric (FaceID / Fingerprint / Windows Hello)
                const assertion = await navigator.credentials.get(credRequestOptions);
                if (!assertion) throw new Error('Biometric authentication cancelled');

                // Step 4: Send assertion to server for verification
                const verifyRes = await fetch(`${API_BASE}/api/auth/webauthn/login-verify`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        credentialId:      bufToB64(assertion.rawId),
                        clientDataJSON:    bufToB64(assertion.response.clientDataJSON),
                        authenticatorData: bufToB64(assertion.response.authenticatorData),
                        signature:         bufToB64(assertion.response.signature)
                    })
                });
                const verifyData = await verifyRes.json();
                if (!verifyRes.ok || verifyData.error) throw new Error(verifyData.error || 'Biometric verification failed');

                // Step 5: Store token & redirect
                localStorage.setItem('gos_token', verifyData.token);
                window.location.href = '../pages/dashboard.html';

            } catch (err) {
                console.error('Biometric login error:', err);
                if (err.name === 'NotAllowedError') {
                    showError('Biometric scan was cancelled or timed out. Try again.');
                } else if (err.name === 'SecurityError') {
                    showError('Security error: ensure the app is running over HTTPS.');
                } else {
                    showError(err.message || 'Biometric authentication failed.');
                }
            }
        }
    </script>
    <script src="../js/app.js"></script>
</body>
</html>

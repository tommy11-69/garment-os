<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>404 — Page Not Found | Garment OS</title>
    
    <!-- Zero-Flicker Dark Mode Theme Resolver -->
    <script>
      (function() {
        if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      })();
    </script>
    
    <!-- Favicon & PWA Icons -->
    <link rel="icon" type="image/png" sizes="192x192" href="assets/icon-192.png?v=2">
    <link rel="icon" type="image/webp" href="assets/favicon-dark.webp?v=2">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png?v=2">
    <link rel="manifest" href="manifest.json?v=2">
    <meta name="theme-color" content="#0059b5">
    
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com" rel="preconnect"/>
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
    
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              brand: '#0059b5',
            }
          }
        }
      }
    </script>
    <style>
      @keyframes float {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      .animate-float { animation: float 4s ease-in-out infinite; }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 font-sans min-h-screen flex items-center justify-center p-4 antialiased transition-colors duration-200">
    <div class="max-w-md w-full bg-white dark:bg-slate-800 rounded-2xl shadow-xl border border-slate-200/80 dark:border-slate-700/80 p-8 text-center relative overflow-hidden backdrop-blur-md">
        <!-- Background Decorative Accent -->
        <div class="absolute -top-16 -right-16 w-36 h-36 bg-blue-500/10 dark:bg-blue-500/20 rounded-full blur-2xl pointer-events-none"></div>
        <div class="absolute -bottom-16 -left-16 w-36 h-36 bg-indigo-500/10 dark:bg-indigo-500/20 rounded-full blur-2xl pointer-events-none"></div>

        <!-- Animated Icon Container -->
        <div class="inline-flex items-center justify-center w-20 h-20 rounded-2xl bg-blue-50 dark:bg-blue-950/60 text-brand dark:text-blue-400 mb-6 animate-float shadow-inner border border-blue-100 dark:border-blue-900/50">
            <span class="material-symbols-outlined text-4xl">map</span>
        </div>

        <!-- Error Code Pill -->
        <div class="inline-block px-3 py-1 rounded-full text-xs font-semibold bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 mb-3 uppercase tracking-wider">
            Error 404
        </div>

        <h1 class="text-3xl font-extrabold text-slate-900 dark:text-white mb-2 tracking-tight">
            Page Not Found
        </h1>

        <p class="text-slate-600 dark:text-slate-400 text-sm mb-8 leading-relaxed">
            The page or route you are attempting to access does not exist, has been relocated, or is temporarily unavailable.
        </p>

        <!-- Actions -->
        <div class="space-y-3">
            <a href="pages/dashboard.html" class="flex items-center justify-center gap-2 w-full py-3 px-4 bg-brand hover:bg-blue-700 text-white font-medium rounded-xl shadow-md hover:shadow-lg transition-all duration-200 transform active:scale-[0.98]">
                <span class="material-symbols-outlined text-xl">dashboard</span>
                Return to Dashboard
            </a>

            <div class="grid grid-cols-2 gap-3 pt-2">
                <a href="auth/login.html" class="flex items-center justify-center gap-2 py-2.5 px-3 bg-slate-100 hover:bg-slate-200 dark:bg-slate-700 dark:hover:bg-slate-600 text-slate-700 dark:text-slate-200 font-medium rounded-xl text-sm transition-colors">
                    <span class="material-symbols-outlined text-lg">login</span>
                    Sign In
                </a>
                <button onclick="window.history.back()" class="flex items-center justify-center gap-2 py-2.5 px-3 bg-slate-100 hover:bg-slate-200 dark:bg-slate-700 dark:hover:bg-slate-600 text-slate-700 dark:text-slate-200 font-medium rounded-xl text-sm transition-colors">
                    <span class="material-symbols-outlined text-lg">arrow_back</span>
                    Go Back
                </button>
            </div>
        </div>

        <!-- Footer Footer -->
        <div class="mt-8 pt-6 border-t border-slate-100 dark:border-slate-700/60 flex items-center justify-between text-xs text-slate-400 dark:text-slate-500">
            <span>Garment OS v1.0</span>
            <span class="inline-flex items-center gap-1.5">
                <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                System Operational
            </span>
        </div>
    </div>
</body>
</html>

<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Garment OS - Production Hub</title>
    
    <!-- Zero-Flicker Dark Mode Theme Resolver & Global Handler -->
    <script>
      (function() {
        if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
        window.toggleTheme = window.toggleTheme || function() {
          const isDark = document.documentElement.classList.toggle('dark');
          localStorage.setItem('theme', isDark ? 'dark' : 'light');
          if (typeof window.updateThemeToggleUI === 'function') {
            window.updateThemeToggleUI(isDark);
          }
          window.dispatchEvent(new CustomEvent('gos-theme-changed', { detail: { isDark } }));
        };
      })();
    </script>
    
    <!-- Favicon & PWA Icons -->
    <link rel="icon" type="image/png" sizes="192x192" href="../assets/icon-192.png?v=2">
    <link rel="icon" type="image/webp" href="../assets/favicon-dark.webp?v=2">
    <link rel="apple-touch-icon" sizes="180x180" href="../assets/apple-touch-icon.png?v=2">
    <link rel="manifest" href="../manifest.json?v=2">
    <meta name="theme-color" content="#0059b5">
    <meta name="mobile-web-app-capable" content="yes">
    
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com" rel="preconnect"/>
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
    
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script src="../js/tailwind.config.js"></script>
    
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/typography.css">
    <link rel="stylesheet" href="../css/utilities.css">
    <link rel="stylesheet" href="../css/responsive.css?v=5.6">

    <style>
        /* Smooth horizontal stage navigation scroll */
        .stage-nav-scroll {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 4px;
            scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
        }
        .stage-nav-scroll::-webkit-scrollbar {
            display: none;
        }
        .stage-nav-pill {
            flex-shrink: 0;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 14px;
            border-radius: 14px;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
            white-space: nowrap;
        }
        .stage-nav-pill.active {
            background-color: var(--color-primary, #0071e3);
            color: #ffffff;
            box-shadow: 0 2px 8px rgba(0, 113, 227, 0.25);
        }
        .stage-nav-pill.inactive {
            background-color: var(--color-surface-container, #f2f2f7);
            color: var(--color-on-surface, #1d1d1f);
            border: 1px solid rgba(0, 0, 0, 0.06);
        }
        .dark .stage-nav-pill.inactive {
            background-color: #1e293b;
            color: #94a3b8;
            border: 1px solid rgba(51, 65, 85, 0.6);
        }
        .stage-nav-pill.inactive:hover {
            background-color: var(--color-surface-variant, #e5e5ea);
        }
        .dark .stage-nav-pill.inactive:hover {
            background-color: #334155;
            color: #f1f5f9;
        }
    </style>
</head>
<body class="font-body text-body antialiased bg-background dark:bg-slate-950 text-on-surface dark:text-slate-100">

    <!-- Desktop & Tablet Sidebar Navigation -->
    <div id="sidebar-container"></div>

    <!-- Global Topbar injected by app.js -->
    <div id="topbar-container"></div>

    <div class="mobile-wrapper">
        <main id="main-content-area" class="flex-1 p-md flex flex-col gap-4 max-w-7xl mx-auto w-full">
            
            <!-- Hero Top Header -->
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 pt-1 pb-1">
                <div>
                    <div class="flex items-center gap-2">
                        <h2 class="text-[26px] sm:text-[30px] leading-tight font-extrabold tracking-tight text-on-surface dark:text-white">Production Hub</h2>
                        <span class="px-2.5 py-0.5 rounded-full text-[11px] font-extrabold bg-primary/10 dark:bg-primary/20 text-primary dark:text-blue-400 uppercase tracking-wider">
                            Factory Execution
                        </span>
                    </div>
                    <p class="text-[13px] text-secondary dark:text-slate-400 mt-0.5">8 Dedicated Operational Workspaces with live floor tracking & data sync</p>
                </div>

                <!-- Interactive Order Selector Trigger Pill -->
                <div class="flex items-center gap-2">
                    <button type="button" onclick="window.productionRouter.openOrderPicker()" 
                        id="order-picker-trigger-btn"
                        class="px-4 py-2 rounded-xl bg-surface-container-lowest dark:bg-slate-900 border border-outline-variant/80 dark:border-slate-800 text-on-surface dark:text-white text-[13px] font-bold active-scale transition-apple hover:border-primary shadow-xs flex items-center gap-2.5 max-w-[320px] sm:max-w-[420px]">
                        <span class="material-symbols-outlined text-[20px] text-primary shrink-0" id="order-picker-trigger-icon">storefront</span>
                        <div class="flex flex-col items-start text-left truncate min-w-0">
                            <span class="text-[10px] font-bold text-secondary dark:text-slate-400 uppercase tracking-wider leading-none">Floor Target</span>
                            <span class="truncate font-extrabold text-[13px] mt-0.5 text-on-surface dark:text-white" id="order-picker-trigger-label">🏢 Floor Overview (All Orders)</span>
                        </div>
                        <span class="material-symbols-outlined text-[18px] text-secondary shrink-0 ml-auto">unfold_more</span>
                    </button>
                </div>
            </div>

            <!-- Active Order & Product Context Strip (Mounted when order is selected) -->
            <div id="order-context-strip" class="hidden"></div>

            <!-- Horizontal Stage Switcher Bar (Sticky) -->
            <div class="sticky top-0 z-20 bg-background/95 dark:bg-slate-950/95 backdrop-blur-md pt-2 pb-2 -mx-md px-md border-b border-outline-variant/40 dark:border-slate-800 transition-colors">
                <div class="stage-nav-scroll" id="stage-nav-bar">
                    <!-- Populated dynamically by index.js with 8 stages -->
                </div>
            </div>

            <!-- Main Production Workspace Container -->
            <div id="production-workspace-container" class="min-h-[500px]">
                <div class="p-12 flex flex-col items-center justify-center text-secondary dark:text-slate-400 gap-3">
                    <span class="material-symbols-outlined text-[48px] animate-spin text-primary">progress_activity</span>
                    <p class="text-[14px] font-medium">Initializing Factory Floor...</p>
                </div>
            </div>
            
            <div class="h-10"></div>
        </main>
    </div>

    <!-- Searchable Order Command Modal -->
    <div id="order-picker-modal" class="fixed inset-0 z-50 flex items-center justify-center p-4 opacity-0 pointer-events-none transition-all duration-200">
        <!-- Backdrop -->
        <div class="absolute inset-0 bg-black/50 backdrop-blur-xs" onclick="window.productionRouter.closeOrderPicker()"></div>
        
        <!-- Modal Dialog -->
        <div class="relative bg-surface-container-lowest dark:bg-slate-900 border border-outline-variant/80 dark:border-slate-800 rounded-3xl shadow-2xl max-w-xl w-full max-h-[85vh] flex flex-col overflow-hidden transform scale-95 transition-transform duration-200" id="order-picker-modal-panel">
            
            <!-- Modal Header with Instant Search -->
            <div class="p-4 border-b border-outline-variant/50 dark:border-slate-800 bg-surface/80 dark:bg-slate-900/80 backdrop-blur-md flex flex-col gap-3">
                <div class="flex items-center justify-between">
                    <div class="flex items-center gap-2">
                        <span class="material-symbols-outlined text-primary text-[22px]">precision_manufacturing</span>
                        <h3 class="text-[16px] font-extrabold text-on-surface dark:text-white">Switch Production Order</h3>
                    </div>
                    <button type="button" onclick="window.productionRouter.closeOrderPicker()" 
                        class="w-8 h-8 rounded-lg bg-surface-variant dark:bg-slate-800 hover:bg-surface-container text-secondary dark:text-slate-300 flex items-center justify-center active-scale">
                        <span class="material-symbols-outlined text-[18px]">close</span>
                    </button>
                </div>

                <div class="relative">
                    <span class="material-symbols-outlined absolute left-3.5 top-1/2 -translate-y-1/2 text-secondary text-[18px]">search</span>
                    <input type="text" id="order-picker-search-input" placeholder="Search order ID, buyer, product style..."
                        class="w-full bg-surface-container dark:bg-slate-800 border border-outline-variant/60 dark:border-slate-700 rounded-xl pl-10 pr-4 py-2.5 text-[13px] text-on-surface dark:text-white outline-none focus:border-primary focus:ring-1 focus:ring-primary placeholder:text-secondary dark:placeholder:text-slate-500">
                </div>
            </div>

            <!-- Modal List of Orders -->
            <div id="order-picker-list" class="flex-1 overflow-y-auto p-3 flex flex-col gap-2 custom-scrollbar">
                <!-- Injected dynamically -->
            </div>

            <!-- Modal Footer -->
            <div class="p-3 border-t border-outline-variant/40 dark:border-slate-800 bg-surface-container-low/50 dark:bg-slate-850/50 flex items-center justify-between text-[11px] text-secondary">
                <span>Select an order to open its active department</span>
                <span class="font-mono">ESC to close</span>
            </div>
        </div>
    </div>
    
    <!-- Bottom Nav -->
    <div id="bottom-nav-container"></div>
    
    <!-- Floating Toast Notifications -->
    <div id="toast-container" class="fixed bottom-20 right-5 z-50 flex flex-col gap-2 pointer-events-none"></div>

    <script src="../js/app.js?v=5.6"></script>
    <script type="module" src="../js/production/index.js?v=5.5"></script>
    <script src="../js/utils/sheet.js"></script>

    <script>
        // Global Toast Notification Helper
        window.showToast = function(msg, type = 'info') {
            const container = document.getElementById('toast-container');
            if (!container) return;
            const toast = document.createElement('div');
            toast.className = `px-4 py-2.5 rounded-xl text-[13px] font-bold shadow-lg text-white pointer-events-auto flex items-center gap-2 transform transition-all duration-300 translate-y-2 opacity-0 ${
                type === 'success' ? 'bg-[#34C759]' : type === 'error' ? 'bg-error' : type === 'warning' ? 'bg-orange-500' : 'bg-on-surface'
            }`;
            toast.innerHTML = `
                <span class="material-symbols-outlined text-[16px]">${type === 'success' ? 'check_circle' : type === 'error' ? 'error' : 'info'}</span>
                <span>${msg}</span>
            `;
            container.appendChild(toast);

            requestAnimationFrame(() => {
                toast.classList.remove('translate-y-2', 'opacity-0');
            });

            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-2');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        };
    </script>
</body>
</html>

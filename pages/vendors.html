<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Garment OS - Vendors</title>
    <meta name="description" content="Manage vendors, track purchases, outstanding payables, and record payments in Garment OS.">

    <!-- Zero-Flicker Dark Mode Theme Resolver & Global Handler -->
    <script>
      (function() {
        if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
        window.toggleTheme = window.toggleTheme || function() {
          const isDark = document.documentElement.classList.toggle('dark');
          localStorage.setItem('theme', isDark ? 'dark' : 'light');
          if (typeof window.updateThemeToggleUI === 'function') {
            window.updateThemeToggleUI(isDark);
          }
          window.dispatchEvent(new CustomEvent('gos-theme-changed', { detail: { isDark } }));
        };
      })();
    </script>

    <!-- Favicon & PWA Icons -->
    <link rel="icon" type="image/png" sizes="192x192" href="../assets/icon-192.png?v=2">
    <link rel="icon" type="image/webp" href="../assets/favicon-dark.webp?v=2">
    <link rel="apple-touch-icon" sizes="180x180" href="../assets/apple-touch-icon.png?v=2">
    <link rel="manifest" href="../manifest.json?v=2">
    <meta name="theme-color" content="#0059b5">
    <meta name="mobile-web-app-capable" content="yes">

    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com" rel="preconnect"/>
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>

    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script src="../js/tailwind.config.js"></script>

    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/typography.css">
    <link rel="stylesheet" href="../css/utilities.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>
<body class="font-body text-body antialiased bg-background dark:bg-slate-950 text-on-surface dark:text-slate-100">

    <!-- Desktop & Tablet Sidebar Navigation -->
    <div id="sidebar-container"></div>

    <div id="topbar-container"></div>

    <div class="mobile-wrapper">
        <main id="main-content-area" class="flex-1 p-md flex flex-col gap-lg">

            <!-- Page Header -->
            <div class="px-xs pt-sm">
                <h2 class="text-[28px] leading-tight font-semibold tracking-tight text-on-surface dark:text-white mb-1">Vendors</h2>
                <p id="vendors-count" class="text-body text-secondary dark:text-slate-400">Loading vendors...</p>
            </div>

            <!-- Search & Filter -->
            <div class="flex gap-2 w-full">
                <div class="relative flex-1">
                    <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant dark:text-slate-400 text-[20px]">search</span>
                    <input id="vendor-search" class="w-full bg-surface-container-lowest border border-outline-variant rounded-2xl py-3 pl-12 pr-4 font-body text-[16px] text-on-surface placeholder:text-on-surface-variant dark:placeholder:text-slate-500 focus:outline-none focus:ring-2 focus:ring-primary/20 transition-apple shadow-sm" placeholder="Search vendors..." type="text"/>
                </div>
            </div>

            <!-- Status Segmented Control -->
            <div class="flex p-1 bg-surface-container dark:bg-slate-900 rounded-[16px] border border-outline-variant/50 dark:border-slate-800">
                <button data-status-filter="Active" class="flex-1 py-2 rounded-[12px] text-[13px] font-semibold bg-surface-container-lowest dark:bg-slate-800 text-on-surface dark:text-white shadow-sm transition-all" onclick="window.setVendorStatusFilter('Active')">Active</button>
                <button data-status-filter="Inactive" class="flex-1 py-2 rounded-[12px] text-[13px] font-semibold text-secondary dark:text-slate-400 transition-all" onclick="window.setVendorStatusFilter('Inactive')">Inactive</button>
                <button data-status-filter="All" class="flex-1 py-2 rounded-[12px] text-[13px] font-semibold text-secondary dark:text-slate-400 transition-all" onclick="window.setVendorStatusFilter('All')">All</button>
            </div>

            <!-- Vendor Type Filter Chips -->
            <div class="flex items-center gap-1.5 overflow-x-auto no-scrollbar py-1" id="vendor-type-chips">
                <button type="button" data-type-filter="All" onclick="window.setVendorTypeFilter('All')"
                    class="px-3 py-1.5 rounded-xl text-[12px] font-bold border transition-all shrink-0 bg-primary text-white border-primary cursor-pointer touch-manipulation">
                    All
                </button>
                <button type="button" data-type-filter="Fabric" onclick="window.setVendorTypeFilter('Fabric')"
                    class="px-3 py-1.5 rounded-xl text-[12px] font-bold border transition-all shrink-0 bg-surface-container-lowest text-secondary border-outline-variant cursor-pointer touch-manipulation">
                    🧵 Fabric
                </button>
                <button type="button" data-type-filter="Stitching" onclick="window.setVendorTypeFilter('Stitching')"
                    class="px-3 py-1.5 rounded-xl text-[12px] font-bold border transition-all shrink-0 bg-surface-container-lowest text-secondary border-outline-variant cursor-pointer touch-manipulation">
                    🪡 Stitching
                </button>
                <button type="button" data-type-filter="Dyeing" onclick="window.setVendorTypeFilter('Dyeing')"
                    class="px-3 py-1.5 rounded-xl text-[12px] font-bold border transition-all shrink-0 bg-surface-container-lowest text-secondary border-outline-variant cursor-pointer touch-manipulation">
                    🎨 Dyeing
                </button>
                <button type="button" data-type-filter="Printing" onclick="window.setVendorTypeFilter('Printing')"
                    class="px-3 py-1.5 rounded-xl text-[12px] font-bold border transition-all shrink-0 bg-surface-container-lowest text-secondary border-outline-variant cursor-pointer touch-manipulation">
                    🖨️ Printing
                </button>
                <button type="button" data-type-filter="Embroidery" onclick="window.setVendorTypeFilter('Embroidery')"
                    class="px-3 py-1.5 rounded-xl text-[12px] font-bold border transition-all shrink-0 bg-surface-container-lowest text-secondary border-outline-variant cursor-pointer touch-manipulation">
                    🌸 Embroidery
                </button>
                <button type="button" data-type-filter="Packaging" onclick="window.setVendorTypeFilter('Packaging')"
                    class="px-3 py-1.5 rounded-xl text-[12px] font-bold border transition-all shrink-0 bg-surface-container-lowest text-secondary border-outline-variant cursor-pointer touch-manipulation">
                    📦 Packaging
                </button>
                <button type="button" data-type-filter="Accessories" onclick="window.setVendorTypeFilter('Accessories')"
                    class="px-3 py-1.5 rounded-xl text-[12px] font-bold border transition-all shrink-0 bg-surface-container-lowest text-secondary border-outline-variant cursor-pointer touch-manipulation">
                    🪢 Accessories
                </button>
                <button type="button" data-type-filter="Other" onclick="window.setVendorTypeFilter('Other')"
                    class="px-3 py-1.5 rounded-xl text-[12px] font-bold border transition-all shrink-0 bg-surface-container-lowest text-secondary border-outline-variant cursor-pointer touch-manipulation">
                    Other
                </button>
            </div>

            <!-- Vendors List -->
            <div class="flex flex-col gap-md">
                <div id="vendors-list-container" class="flex flex-col gap-md min-h-[200px]"></div>
            </div>

            <div class="h-6"></div>
        </main>
    </div>

    <!-- FAB: Add Vendor -->
    <div id="fab-container" data-icon="add" data-action="openSheet('addVendorSheet')"></div>

    <div id="bottom-nav-container"></div>

    <!-- Sheets injected by JS -->
    <div id="sheets-container"></div>

    <script src="../js/app.js"></script>
    <script type="module" src="../js/vendors/index.js?v=5.2"></script>
    <script src="../js/utils/sheet.js"></script>
</body>
</html>

<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Garment OS - Finance</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com" rel="preconnect"/>
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script src="../js/tailwind.config.js"></script>
    
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/typography.css">
    <link rel="stylesheet" href="../css/utilities.css">

    <style>
        /* ── Chart Container Animations ── */
        .chart-card { transition: transform .2s ease, box-shadow .2s ease; }
        .chart-card:active { transform: scale(0.99); }

        /* SVG polyline animate-in */
        .chart-line { stroke-dasharray: 1000; stroke-dashoffset: 1000; animation: drawLine 1.2s cubic-bezier(.4,0,.2,1) forwards; }
        @keyframes drawLine { to { stroke-dashoffset: 0; } }

        /* Area gradient fade-in */
        .chart-area { opacity: 0; animation: fadeArea .8s ease .4s forwards; }
        @keyframes fadeArea { to { opacity: 1; } }

        /* Bar fill up */
        .bar-fill { transform-origin: bottom; transform: scaleY(0); animation: fillBar .6s cubic-bezier(.34,1.56,.64,1) forwards; }
        @keyframes fillBar { to { transform: scaleY(1); } }

        /* Donut ring */
        .donut-seg { transition: opacity .2s; }
        .donut-seg:hover { opacity: .8; }

        /* Period toggle pills */
        .period-pill { transition: all .15s ease; }
        .period-pill.active { background: var(--color-primary, #0A84FF); color: white; }
        .period-pill.inactive { background: transparent; color: #6b7280; }

        /* Tooltip */
        .chart-tooltip {
            position: absolute;
            background: rgba(30,30,30,.92);
            color: white;
            font-size: 12px;
            font-weight: 600;
            padding: 5px 10px;
            border-radius: 8px;
            pointer-events: none;
            white-space: nowrap;
            opacity: 0;
            transition: opacity .15s;
            z-index: 50;
        }
        .chart-tooltip.visible { opacity: 1; }

        /* Legend dots */
        .legend-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }

        /* Scrollable no-bar */
        .no-scrollbar { scrollbar-width: none; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="font-body text-body antialiased bg-background">

    <div id="topbar-container"></div>

    <div class="mobile-wrapper">
        <main id="main-content-area" class="flex-1 p-md flex flex-col gap-lg pb-32">
            
            <!-- Header -->
            <div class="px-xs pt-sm flex items-start justify-between">
                <div>
                    <h2 class="text-[28px] leading-tight font-semibold tracking-tight text-on-surface mb-1">Cash Flow</h2>
                    <p class="text-[15px] text-secondary">Financial Overview</p>
                </div>
                <!-- Period selector -->
                <div class="flex items-center gap-1 p-1 bg-surface-container-lowest border border-outline-variant rounded-xl mt-1">
                    <button class="period-pill active text-[11px] font-bold px-2.5 py-1.5 rounded-lg" data-period="week" onclick="window.finSetPeriod('week')">W</button>
                    <button class="period-pill inactive text-[11px] font-bold px-2.5 py-1.5 rounded-lg" data-period="month" onclick="window.finSetPeriod('month')">M</button>
                    <button class="period-pill inactive text-[11px] font-bold px-2.5 py-1.5 rounded-lg" data-period="year" onclick="window.finSetPeriod('year')">Y</button>
                </div>
            </div>

            <!-- ── KPI Summary Cards ── -->
            <div id="finance-dashboard-container" class="flex flex-col gap-4"></div>

            <!-- ── Charts Section ── -->
            <div id="finance-charts-section" class="flex flex-col gap-4">

                <!-- Revenue vs Expenses Area Chart -->
                <div class="chart-card bg-surface-container-lowest rounded-[24px] border border-outline-variant p-4 shadow-sm">
                    <div class="flex items-center justify-between mb-4">
                        <div>
                            <h3 class="text-[15px] font-bold text-on-surface">Revenue vs Expenses</h3>
                            <p class="text-[12px] text-secondary mt-0.5" id="area-chart-subtitle">Last 7 days</p>
                        </div>
                        <div class="flex items-center gap-3">
                            <div class="flex items-center gap-1.5">
                                <div class="legend-dot bg-[#0A84FF]"></div>
                                <span class="text-[11px] text-secondary font-medium">Income</span>
                            </div>
                            <div class="flex items-center gap-1.5">
                                <div class="legend-dot bg-[#FF453A]"></div>
                                <span class="text-[11px] text-secondary font-medium">Expense</span>
                            </div>
                        </div>
                    </div>
                    <div class="relative" style="height:160px;">
                        <svg id="area-chart-svg" width="100%" height="160" viewBox="0 0 340 160" preserveAspectRatio="none" style="overflow:visible;"></svg>
                        <div id="area-tooltip" class="chart-tooltip"></div>
                    </div>
                    <!-- X labels -->
                    <div id="area-chart-labels" class="flex justify-between mt-2 px-1"></div>
                </div>

                <!-- Net Cash Flow Bar Chart -->
                <div class="chart-card bg-surface-container-lowest rounded-[24px] border border-outline-variant p-4 shadow-sm">
                    <div class="flex items-center justify-between mb-4">
                        <div>
                            <h3 class="text-[15px] font-bold text-on-surface">Net Cash Flow</h3>
                            <p class="text-[12px] text-secondary mt-0.5" id="bar-chart-subtitle">Monthly trend</p>
                        </div>
                        <div id="net-flow-badge" class="px-2.5 py-1 rounded-lg text-[12px] font-bold"></div>
                    </div>
                    <div class="relative flex items-end gap-1.5 px-1" style="height:120px;" id="bar-chart-container">
                        <!-- Bars rendered by JS -->
                    </div>
                    <div id="bar-chart-labels" class="flex justify-around mt-2 px-1"></div>
                </div>

                <!-- Category Donut + Breakdown -->
                <div class="chart-card bg-surface-container-lowest rounded-[24px] border border-outline-variant p-4 shadow-sm">
                    <h3 class="text-[15px] font-bold text-on-surface mb-4">Expense Breakdown</h3>
                    <div class="flex gap-4 items-center">
                        <!-- Donut -->
                        <div class="relative flex-shrink-0" style="width:110px;height:110px;">
                            <svg id="donut-chart-svg" width="110" height="110" viewBox="0 0 110 110"></svg>
                            <div class="absolute inset-0 flex flex-col items-center justify-center">
                                <p class="text-[10px] font-bold text-secondary uppercase tracking-wider">Total</p>
                                <p id="donut-center-value" class="text-[15px] font-bold text-on-surface leading-tight"></p>
                            </div>
                        </div>
                        <!-- Legend breakdown -->
                        <div id="donut-legend" class="flex-1 flex flex-col gap-2 min-w-0"></div>
                    </div>
                </div>

                <!-- Income Sources horizontal bar -->
                <div class="chart-card bg-surface-container-lowest rounded-[24px] border border-outline-variant p-4 shadow-sm">
                    <h3 class="text-[15px] font-bold text-on-surface mb-4">Income Sources</h3>
                    <div id="income-sources-list" class="flex flex-col gap-3"></div>
                </div>

            </div>

            <!-- Search & Actions -->
            <div class="flex items-center gap-3 mt-2">
                <div class="relative flex-1">
                    <span class="material-symbols-outlined absolute left-3.5 top-1/2 -translate-y-1/2 text-secondary text-[20px]" aria-hidden="true">search</span>
                    <input type="text" id="transaction-search-input" placeholder="Search transactions..." autocomplete="off"
                           class="w-full bg-surface-container-lowest border border-outline-variant rounded-2xl pl-10 pr-4 py-3.5 text-[15px] text-on-surface focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-apple shadow-sm placeholder:text-secondary">
                </div>
                <button onclick="window.openSheet('filterSheet')" class="w-12 h-12 shrink-0 rounded-2xl bg-surface-container-lowest border border-outline-variant flex items-center justify-center text-on-surface active-scale transition-apple shadow-sm">
                    <span class="material-symbols-outlined text-[22px]">tune</span>
                </button>
            </div>

            <div class="flex items-center justify-between">
                <h3 class="text-[18px] font-bold text-on-surface tracking-tight">Recent Transactions</h3>
            </div>
            
            <div id="transactions-list" class="flex flex-col">
                <!-- Transactions rendered here -->
            </div>
        </main>
    </div>
    
    <div id="fab-container" data-icon="receipt_long" data-action="window.openSheet('addTransactionSheet')"></div>
    <div id="bottom-nav-container"></div>
    
    <div id="sheets-container"></div>
    
    <script type="module" src="../js/finance/index.js"></script>
    <script src="../js/utils/sheet.js"></script>
    <script src="../js/app.js"></script>

    <!-- ── Chart Engine (pure SVG, no library) ── -->
    <script>
    (function() {
        // ─── State ────────────────────────────────────────────────────────────
        let _transactions = [];
        let _period = 'week';

        window.finSetPeriod = function(period) {
            _period = period;
            document.querySelectorAll('.period-pill').forEach(el => {
                el.classList.toggle('active',   el.dataset.period === period);
                el.classList.toggle('inactive', el.dataset.period !== period);
            });
            if (_transactions.length) renderAllCharts(_transactions);
        };

        // Called by finance/index.js after data loads
        window.renderFinanceCharts = function(transactions) {
            _transactions = transactions || [];
            renderAllCharts(_transactions);
        };

        // ─── Helpers ──────────────────────────────────────────────────────────
        const fmt = n => '₹' + Math.abs(n).toLocaleString('en-IN', { maximumFractionDigits: 0 });
        const DAY_MS = 86400000;

        function getPeriodDays() {
            return _period === 'year' ? 365 : _period === 'month' ? 30 : 7;
        }

        function getPeriodTransactions(txns) {
            const cutoff = Date.now() - getPeriodDays() * DAY_MS;
            return txns.filter(t => new Date(t.date).getTime() >= cutoff);
        }

        function groupByDate(txns, days) {
            const now = new Date();
            const buckets = [];
            for (let i = days - 1; i >= 0; i--) {
                const d = new Date(now);
                d.setDate(d.getDate() - i);
                const key = d.toISOString().split('T')[0];
                const dayTxns = txns.filter(t => t.date === key);
                buckets.push({
                    label: _period === 'year'
                        ? d.toLocaleString('en', { month: 'short' })
                        : _period === 'month'
                            ? d.getDate() + ''
                            : d.toLocaleString('en', { weekday: 'short' }),
                    income:   dayTxns.filter(t => t.type === 'Income').reduce((s, t) => s + +t.amount, 0),
                    expenses: dayTxns.filter(t => t.type === 'Expense').reduce((s, t) => s + +t.amount, 0),
                });
            }
            return buckets;
        }

        function groupByMonth(txns) {
            const months = [];
            const now = new Date();
            for (let i = 5; i >= 0; i--) {
                const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
                const key = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
                const mTxns = txns.filter(t => t.date && t.date.startsWith(key));
                const income   = mTxns.filter(t => t.type === 'Income').reduce((s, t) => s + +t.amount, 0);
                const expenses = mTxns.filter(t => t.type === 'Expense').reduce((s, t) => s + +t.amount, 0);
                months.push({
                    label: d.toLocaleString('en', { month: 'short' }),
                    net: income - expenses,
                });
            }
            return months;
        }

        // ─── Area Chart ───────────────────────────────────────────────────────
        function renderAreaChart(txns) {
            const days   = getPeriodDays();
            const data   = groupByDate(txns, Math.min(days, 14));
            const svg    = document.getElementById('area-chart-svg');
            const labels = document.getElementById('area-chart-labels');
            const sub    = document.getElementById('area-chart-subtitle');
            if (!svg || !labels) return;

            sub.textContent = _period === 'week' ? 'Last 7 days' : _period === 'month' ? 'Last 30 days' : 'Last 365 days';

            const W = 340, H = 160, PAD = { t: 10, b: 30, l: 8, r: 8 };
            const cW = W - PAD.l - PAD.r;
            const cH = H - PAD.t - PAD.b;
            const n  = data.length;

            const maxVal = Math.max(...data.map(d => Math.max(d.income, d.expenses)), 1);

            const xPos = i => PAD.l + (i / (n - 1)) * cW;
            const yInc = d => PAD.t + cH - (d.income / maxVal) * cH;
            const yExp = d => PAD.t + cH - (d.expenses / maxVal) * cH;

            // Grid lines
            let gridSvg = '';
            [0.25, 0.5, 0.75, 1].forEach(p => {
                const y = PAD.t + cH - p * cH;
                gridSvg += `<line x1="${PAD.l}" y1="${y}" x2="${W - PAD.r}" y2="${y}" stroke="rgba(0,0,0,.06)" stroke-width="1"/>`;
                gridSvg += `<text x="${PAD.l}" y="${y - 3}" font-size="8" fill="#9ca3af" font-family="Inter,sans-serif">${fmt(maxVal * p)}</text>`;
            });

            // Build paths
            const incPts = data.map((d, i) => `${xPos(i)},${yInc(d)}`).join(' ');
            const expPts = data.map((d, i) => `${xPos(i)},${yExp(d)}`).join(' ');
            const baseY = PAD.t + cH;

            const incAreaPts = `${xPos(0)},${baseY} ${incPts} ${xPos(n-1)},${baseY}`;
            const expAreaPts = `${xPos(0)},${baseY} ${expPts} ${xPos(n-1)},${baseY}`;

            // Dot hit areas (invisible — for tooltip)
            const dots = data.map((d, i) => `
                <circle cx="${xPos(i)}" cy="${yInc(d)}" r="12" fill="transparent"
                    onmouseenter="window._finTooltip(event,'${d.label}','Income ${fmt(d.income)}')"
                    onmouseleave="window._finHideTooltip()"
                    ontouchstart="window._finTooltip(event,'${d.label}','Income ${fmt(d.income)}')"
                />
                <circle cx="${xPos(i)}" cy="${yExp(d)}" r="12" fill="transparent"
                    onmouseenter="window._finTooltip(event,'${d.label}','Expense ${fmt(d.expenses)}')"
                    onmouseleave="window._finHideTooltip()"
                    ontouchstart="window._finTooltip(event,'${d.label}','Expense ${fmt(d.expenses)}')"
                />
                <circle cx="${xPos(i)}" cy="${yInc(d)}" r="3.5" fill="#0A84FF" stroke="white" stroke-width="1.5"/>
                <circle cx="${xPos(i)}" cy="${yExp(d)}" r="3.5" fill="#FF453A" stroke="white" stroke-width="1.5"/>
            `).join('');

            svg.innerHTML = `
                <defs>
                    <linearGradient id="incGrad" x1="0" y1="0" x2="0" y2="1">
                        <stop offset="0%" stop-color="#0A84FF" stop-opacity=".25"/>
                        <stop offset="100%" stop-color="#0A84FF" stop-opacity="0"/>
                    </linearGradient>
                    <linearGradient id="expGrad" x1="0" y1="0" x2="0" y2="1">
                        <stop offset="0%" stop-color="#FF453A" stop-opacity=".2"/>
                        <stop offset="100%" stop-color="#FF453A" stop-opacity="0"/>
                    </linearGradient>
                </defs>
                ${gridSvg}
                <!-- Areas -->
                <polygon class="chart-area" points="${expAreaPts}" fill="url(#expGrad)"/>
                <polygon class="chart-area" points="${incAreaPts}" fill="url(#incGrad)" style="animation-delay:.1s"/>
                <!-- Lines -->
                <polyline class="chart-line" points="${expPts}" fill="none" stroke="#FF453A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                <polyline class="chart-line" points="${incPts}" fill="none" stroke="#0A84FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="animation-delay:.15s"/>
                <!-- Dots -->
                ${dots}
            `;

            // Show only a few labels to avoid crowding
            const step = Math.ceil(n / 6);
            labels.innerHTML = data
                .filter((_, i) => i % step === 0 || i === n - 1)
                .map(d => `<span class="text-[10px] text-secondary font-medium">${d.label}</span>`)
                .join('');
        }

        // ─── Bar Chart ────────────────────────────────────────────────────────
        function renderBarChart(txns) {
            const months = groupByMonth(txns);
            const container = document.getElementById('bar-chart-container');
            const labels    = document.getElementById('bar-chart-labels');
            const badge     = document.getElementById('net-flow-badge');
            if (!container) return;

            const maxAbs = Math.max(...months.map(m => Math.abs(m.net)), 1);
            const BARCONT_H = 120;

            const latestNet = months[months.length - 1]?.net || 0;
            if (badge) {
                badge.textContent = (latestNet >= 0 ? '+' : '') + fmt(latestNet);
                badge.className = `px-2.5 py-1 rounded-lg text-[12px] font-bold ${latestNet >= 0 ? 'bg-green-100 text-[#008A00]' : 'bg-red-100 text-red-600'}`;
            }

            container.style.height = BARCONT_H + 'px';
            container.innerHTML = months.map((m, i) => {
                const isPos = m.net >= 0;
                const pct   = Math.abs(m.net) / maxAbs;
                const barH  = Math.max(Math.round(pct * (BARCONT_H - 16)), 4);
                const delay = i * 0.07;
                const isLast = i === months.length - 1;
                return `
                    <div class="flex-1 flex flex-col items-center justify-end h-full gap-1 relative group cursor-pointer"
                        onmouseenter="window._finTooltip(event,'${m.label}','${isPos?'Net +':'Net '}${fmt(m.net)}')"
                        onmouseleave="window._finHideTooltip()"
                        ontouchstart="window._finTooltip(event,'${m.label}','${isPos?'Net +':'Net '}${fmt(m.net)}')">
                        <div class="bar-fill w-full rounded-t-lg ${isLast ? (isPos ? 'bg-primary' : 'bg-error') : (isPos ? 'bg-primary/40' : 'bg-error/40')}"
                            style="height:${barH}px;animation-delay:${delay}s;"></div>
                    </div>`;
            }).join('');

            if (labels) {
                labels.innerHTML = months.map(m =>
                    `<span class="text-[10px] text-secondary font-medium">${m.label}</span>`
                ).join('');
            }
        }

        // ─── Donut Chart ──────────────────────────────────────────────────────
        const CAT_COLORS = [
            '#0A84FF','#FF9F0A','#30D158','#FF453A','#BF5AF2',
            '#5AC8FA','#FFD60A','#FF6B6B','#4CD964','#AC8E68',
        ];

        function renderDonutChart(txns) {
            const periodT = getPeriodTransactions(txns);
            const expenses = periodT.filter(t => t.type === 'Expense');
            const svg      = document.getElementById('donut-chart-svg');
            const legend   = document.getElementById('donut-legend');
            const center   = document.getElementById('donut-center-value');
            if (!svg || !legend) return;

            // Group by category
            const catMap = {};
            expenses.forEach(t => {
                const cat = t.category || 'Other';
                catMap[cat] = (catMap[cat] || 0) + +t.amount;
            });
            const total = Object.values(catMap).reduce((s, v) => s + v, 0);

            if (center) center.textContent = total > 0 ? fmt(total) : '₹0';

            if (total === 0) {
                svg.innerHTML = `<circle cx="55" cy="55" r="38" fill="none" stroke="#e5e7eb" stroke-width="16"/>`;
                legend.innerHTML = `<p class="text-[12px] text-secondary">No expenses in period</p>`;
                return;
            }

            const sorted = Object.entries(catMap).sort((a, b) => b[1] - a[1]).slice(0, 8);
            const CX = 55, CY = 55, R = 38, SW = 16;
            const circumference = 2 * Math.PI * R;

            let offset = 0;
            const segs = sorted.map(([cat, val], i) => {
                const pct  = val / total;
                const dash = circumference * pct;
                const gap  = circumference - dash;
                const seg  = `<circle class="donut-seg" cx="${CX}" cy="${CY}" r="${R}" fill="none"
                    stroke="${CAT_COLORS[i % CAT_COLORS.length]}"
                    stroke-width="${SW}"
                    stroke-dasharray="${dash} ${gap}"
                    stroke-dashoffset="${-offset}"
                    transform="rotate(-90 ${CX} ${CY})"
                    onmouseenter="window._finTooltip(event,'${cat}','${fmt(val)} (${Math.round(pct*100)}%)')"
                    onmouseleave="window._finHideTooltip()"
                    style="cursor:pointer"
                />`;
                offset += dash;
                return seg;
            });

            svg.innerHTML = `
                <circle cx="${CX}" cy="${CY}" r="${R}" fill="none" stroke="#f3f4f6" stroke-width="${SW}"/>
                ${segs.join('')}
            `;

            legend.innerHTML = sorted.map(([cat, val], i) => {
                const pct = Math.round(val / total * 100);
                return `
                    <div class="flex items-center gap-2 min-w-0">
                        <div style="width:8px;height:8px;border-radius:50%;background:${CAT_COLORS[i % CAT_COLORS.length]};flex-shrink:0;"></div>
                        <span class="text-[12px] text-on-surface font-medium truncate flex-1">${cat}</span>
                        <span class="text-[12px] font-bold text-on-surface shrink-0">${pct}%</span>
                    </div>`;
            }).join('');
        }

        // ─── Income Sources ───────────────────────────────────────────────────
        function renderIncomeSources(txns) {
            const container = document.getElementById('income-sources-list');
            if (!container) return;

            const periodT = getPeriodTransactions(txns);
            const incomes = periodT.filter(t => t.type === 'Income');
            const total   = incomes.reduce((s, t) => s + +t.amount, 0);

            if (total === 0) {
                container.innerHTML = `<p class="text-[13px] text-secondary italic">No income in this period</p>`;
                return;
            }

            const catMap = {};
            incomes.forEach(t => {
                const cat = t.category || 'Other';
                catMap[cat] = (catMap[cat] || 0) + +t.amount;
            });

            const sorted = Object.entries(catMap).sort((a, b) => b[1] - a[1]).slice(0, 6);

            container.innerHTML = sorted.map(([cat, val], i) => {
                const pct = Math.round(val / total * 100);
                const color = CAT_COLORS[i % CAT_COLORS.length];
                return `
                    <div>
                        <div class="flex items-center justify-between mb-1">
                            <span class="text-[13px] font-medium text-on-surface">${cat}</span>
                            <div class="flex items-center gap-2">
                                <span class="text-[11px] text-secondary">${pct}%</span>
                                <span class="text-[13px] font-bold text-on-surface">${fmt(val)}</span>
                            </div>
                        </div>
                        <div class="w-full h-1.5 bg-surface-variant rounded-full overflow-hidden">
                            <div class="h-full rounded-full" style="width:${pct}%;background:${color};transition:width .8s cubic-bezier(.4,0,.2,1);"></div>
                        </div>
                    </div>`;
            }).join('');
        }

        // ─── Tooltip ──────────────────────────────────────────────────────────
        window._finTooltip = function(e, label, value) {
            const tt = document.getElementById('area-tooltip');
            if (!tt) return;
            tt.textContent = `${label}: ${value}`;
            tt.classList.add('visible');
            const rect = (e.target || e.currentTarget).getBoundingClientRect();
            const parentRect = tt.parentElement?.getBoundingClientRect() || { left: 0, top: 0 };
            tt.style.left = Math.max(0, rect.left - parentRect.left - 20) + 'px';
            tt.style.top  = (rect.top - parentRect.top - 30) + 'px';
        };
        window._finHideTooltip = function() {
            document.querySelectorAll('.chart-tooltip').forEach(el => el.classList.remove('visible'));
        };

        // ─── Master render ────────────────────────────────────────────────────
        function renderAllCharts(txns) {
            renderAreaChart(txns);
            renderBarChart(txns);
            renderDonutChart(txns);
            renderIncomeSources(txns);
        }
    })();
    </script>
</body>
</html>

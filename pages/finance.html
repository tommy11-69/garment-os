<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Garment OS - Finance</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com" rel="preconnect"/>
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
    
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script src="../js/tailwind.config.js"></script>
    
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/typography.css">
    <link rel="stylesheet" href="../css/utilities.css">
</head>
<body class="font-body text-body antialiased bg-background">

    <div id="topbar-container"></div>

    <div class="mobile-wrapper">
                <main id="main-content-area" class="flex-1 p-md flex flex-col gap-lg pb-32">
            
            <div class="px-xs pt-sm">
                <h2 class="text-[28px] leading-tight font-semibold tracking-tight text-on-surface mb-1">Cash Flow</h2>
                <p class="text-[15px] text-secondary">Financial Overview</p>
            </div>
            
            <!-- Dashboard Cards container -->
            <div id="finance-dashboard-container" class="flex flex-col gap-4">
                <!-- Rendered dynamically -->
            </div>

            <!-- Search & Actions -->
            <div class="flex items-center gap-3 mt-2">
                <div class="relative flex-1">
                    <span class="material-symbols-outlined absolute left-3.5 top-1/2 -translate-y-1/2 text-secondary text-[20px]" aria-hidden="true">search</span>
                    <input type="text" id="transaction-search-input" placeholder="Search transactions..." autocomplete="off"
                           class="w-full bg-surface-container-lowest border border-outline-variant rounded-2xl pl-10 pr-4 py-3.5 text-[15px] text-on-surface focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-apple shadow-sm placeholder:text-secondary">
                </div>
                
                <button onclick="window.openSheet('filterSheet')" class="w-12 h-12 shrink-0 rounded-2xl bg-surface-container-lowest border border-outline-variant flex items-center justify-center text-on-surface active-scale transition-apple shadow-sm">
                    <span class="material-symbols-outlined text-[22px]">tune</span>
                </button>
            </div>

            <div class="flex items-center justify-between mb-2">
                <h3 class="text-[18px] font-bold text-on-surface tracking-tight">Recent Transactions</h3>
            </div>
            
            <div id="transactions-list" class="flex flex-col">
                <!-- Transactions rendered here -->
            </div>
        </main>
    </div>
    
    <div id="fab-container" data-icon="receipt_long" data-action="window.openSheet('addTransactionSheet')"></div>
    <div id="bottom-nav-container"></div>
    
    <div id="sheets-container"></div>
    
    <script type="module" src="../js/finance/index.js"></script>
    <script src="../js/utils/sheet.js"></script>
    <script src="../js/app.js"></script>
</body>
</html>

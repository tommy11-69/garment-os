<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Garment OS - Quotations</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com" rel="preconnect"/>
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script src="../js/tailwind.config.js"></script>
    
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/typography.css">
    <link rel="stylesheet" href="../css/utilities.css">
</head>
<body class="font-body text-body antialiased bg-background">

    <div id="topbar-container"></div>

    <div class="mobile-wrapper">
        <main id="main-content-area" class="flex-1 p-md flex flex-col gap-lg pb-[100px]">
            
            <!-- Header -->
            <div class="px-xs pt-sm">
                <h2 class="text-[28px] leading-tight font-semibold tracking-tight text-on-surface mb-1">Quotations</h2>
                <p class="text-[14px] text-secondary">Create and manage client sales proposals</p>
            </div>
            
            <!-- Search & Filter -->
            <div class="px-xs">
                <div class="flex items-center gap-3">
                    <div class="relative flex-1">
                        <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-secondary">search</span>
                        <input id="quotations-search-input" type="text" placeholder="Search quotations..."
                            class="w-full bg-surface-container-lowest border border-outline-variant rounded-xl pl-11 pr-4 py-3 text-[15px] text-on-surface focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-apple placeholder:text-secondary">
                    </div>
                </div>
            </div>

            <!-- Segmented Control for Active / Completed -->
            <div class="px-xs">
                <div class="flex p-1 bg-surface-container-lowest border border-outline-variant rounded-xl">
                    <button id="tab-drafts" onclick="window.setQuotationFilter('Draft')" class="flex-1 py-2 text-[14px] font-semibold rounded-lg bg-surface-variant text-on-surface transition-colors">Drafts</button>
                    <button id="tab-sent" onclick="window.setQuotationFilter('Sent')" class="flex-1 py-2 text-[14px] font-semibold rounded-lg text-secondary hover:text-on-surface transition-colors">Sent</button>
                    <button id="tab-accepted" onclick="window.setQuotationFilter('Accepted')" class="flex-1 py-2 text-[14px] font-semibold rounded-lg text-secondary hover:text-on-surface transition-colors">Accepted</button>
                </div>
            </div>

            <!-- Quotations List Container -->
            <div id="quotations-list" class="flex flex-col gap-4 px-xs">
                <!-- Renders dynamically -->
            </div>
            
        </main>
    </div>
    
    <!-- Bottom Nav -->
    <div id="bottom-nav-container"></div>
    
    <!-- FAB for New Quotation -->
    <div id="fab-container" data-icon="add" data-action="window.openCreateQuotationSheet()"></div>
    
    <!-- Bottom Sheets Container -->
    <div id="sheets-container"></div>
    
    <script type="module" src="../js/quotations/index.js"></script>
    <script src="../js/utils/sheet.js"></script>
    <script src="../js/app.js"></script>
</body>
</html>

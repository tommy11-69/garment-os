<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Garment OS - Dashboard</title>
    
    <!-- Material Symbols -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com" rel="preconnect"/>
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script src="../js/tailwind.config.js"></script>
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/typography.css">
    <link rel="stylesheet" href="../css/utilities.css">
</head>
<body class="font-body text-body antialiased">

    <!-- TopNavBar Placeholder -->
    <div id="topbar-container"></div>

    <!-- Main Content Area -->
    <div class="mobile-wrapper">
        <main id="main-content-area" class="flex-1 p-md flex flex-col gap-lg">
            
            <!-- Greeting Section -->
            <div class="px-xs pt-sm pb-xs">
                <h2 class="text-[28px] leading-tight font-semibold tracking-tight text-on-surface mb-1">Good morning, Michael</h2>
                <p class="text-body text-secondary">Here's your production overview.</p>
            </div>
            
            <!-- Metric Cards Container -->
            <div id="dashboard-metrics" class="grid grid-cols-2 gap-md"></div>
            <script type="module" src="../js/dashboard/index.js"></script>

            <!-- Quick Actions -->
            <div class="bg-surface-container-lowest rounded-[24px] border border-outline-variant p-md shadow-sm">
                <h3 class="font-section-title text-[18px] text-on-surface mb-md">Quick Actions</h3>
                <div class="flex gap-md overflow-x-auto pb-2 snap-x hide-scrollbar">
                    <button onclick="window.location.href='orders.html'" class="snap-start flex flex-col items-center justify-center min-w-[80px] gap-2 active-scale transition-apple">
                        <div class="w-14 h-14 rounded-full bg-primary/10 text-primary flex items-center justify-center">
                            <span class="material-symbols-outlined text-[24px]">add_circle</span>
                        </div>
                        <span class="text-caption font-medium text-on-surface text-center">New<br>Order</span>
                    </button>
                    <button onclick="window.location.href='calculator.html'" class="snap-start flex flex-col items-center justify-center min-w-[80px] gap-2 active-scale transition-apple">
                        <div class="w-14 h-14 rounded-full bg-[#008A00]/10 text-[#008A00] flex items-center justify-center">
                            <span class="material-symbols-outlined text-[24px]">calculate</span>
                        </div>
                        <span class="text-caption font-medium text-on-surface text-center">Cost<br>Calc</span>
                    </button>
                    <button onclick="window.location.href='customers.html'" class="snap-start flex flex-col items-center justify-center min-w-[80px] gap-2 active-scale transition-apple">
                        <div class="w-14 h-14 rounded-full bg-[#FF9F0A]/10 text-[#FF9F0A] flex items-center justify-center">
                            <span class="material-symbols-outlined text-[24px]">person_add</span>
                        </div>
                        <span class="text-caption font-medium text-on-surface text-center">Add<br>Client</span>
                    </button>
                    <button onclick="window.location.href='inventory.html'" class="snap-start flex flex-col items-center justify-center min-w-[80px] gap-2 active-scale transition-apple">
                        <div class="w-14 h-14 rounded-full bg-[#5E5CE6]/10 text-[#5E5CE6] flex items-center justify-center">
                            <span class="material-symbols-outlined text-[24px]">inventory_2</span>
                        </div>
                        <span class="text-caption font-medium text-on-surface text-center">Update<br>Stock</span>
                    </button>
                </div>
            </div>

            <!-- Recent Orders -->
            <div class="flex flex-col gap-sm">
                <div class="flex items-center justify-between px-xs">
                    <h3 class="font-section-title text-[20px] text-on-surface">Recent Orders</h3>
                    <button onclick="window.location.href='orders.html'" class="text-primary text-body font-medium active:opacity-70">See All</button>
                </div>
                
                <div id="dashboard-recent-orders" class="bg-surface-container-lowest rounded-[24px] border border-outline-variant shadow-sm overflow-hidden flex flex-col divide-y divide-outline-variant/50">
                    <!-- Data will be injected here -->
                </div>
            </div>

            <!-- Production Progress -->
            <div class="flex flex-col gap-sm">
                <div class="flex items-center justify-between px-xs">
                    <h3 class="font-section-title text-[20px] text-on-surface">Active Batches</h3>
                </div>
                <div id="dashboard-active-batches" class="bg-surface-container-lowest rounded-[24px] border border-outline-variant shadow-sm p-md flex flex-col gap-lg">
                    <!-- Data will be injected here -->
                </div>
            </div>

            <!-- Recent Activity -->
            <div class="flex flex-col gap-sm">
                <div class="flex items-center justify-between px-xs">
                    <h3 class="font-section-title text-[20px] text-on-surface">Activity</h3>
                </div>
                <div class="bg-surface-container-lowest rounded-[24px] border border-outline-variant shadow-sm p-md pb-sm">
                    <div class="relative border-l-2 border-[#E5E5EA] ml-3 space-y-6">
                        <!-- Activity Item 1 -->
                        <div class="relative pl-6">
                            <div class="absolute -left-[9px] top-0 w-4 h-4 rounded-full bg-primary ring-4 ring-white"></div>
                            <div class="mb-1">
                                <span class="text-body-bold text-on-surface">Inventory Alert</span>
                            </div>
                            <p class="text-body text-secondary leading-snug">Low stock on Navy Blue Thread. Reorder recommended.</p>
                            <span class="text-caption text-secondary mt-1 block">10 mins ago</span>
                        </div>
                        <!-- Activity Item 2 -->
                        <div class="relative pl-6">
                            <div class="absolute -left-[9px] top-0 w-4 h-4 rounded-full bg-[#008A00] ring-4 ring-white"></div>
                            <div class="mb-1">
                                <span class="text-body-bold text-on-surface">Batch Complete</span>
                            </div>
                            <p class="text-body text-secondary leading-snug">Batch #B-8090 cleared QA inspection.</p>
                            <span class="text-caption text-secondary mt-1 block">2 hrs ago</span>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- Bottom Padding for Scroll -->
            <div class="h-6"></div>

        </main>
    </div>
    
    <!-- BottomNavBar Placeholder -->
    <div id="bottom-nav-container"></div>

    <!-- Application Logic -->
    <script src="../js/app.js"></script>
    <style>
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</body>
</html>

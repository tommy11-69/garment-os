<!DOCTYPE html>
<html class="light" lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport" />
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Cost Calculator - Garment OS</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap"
        rel="stylesheet" />

    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script src="../js/tailwind.config.js"></script>

    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/typography.css">
    <link rel="stylesheet" href="../css/utilities.css">
    <link rel="stylesheet" href="../css/calculator.css">

    <style>
        /* Tab button active state */
        .calc-tab-btn.active {
            background: var(--color-on-surface, #1C1B1F);
            color: var(--color-surface, #FFFBFE);
        }

        .calc-tab-panel {
            display: none;
        }

        .calc-tab-panel.active {
            display: flex;
            flex-direction: column;
        }

        /* Pop-in animation for result values */
        @keyframes popIn {
            from {
                transform: scale(0.82);
                opacity: 0;
            }

            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        .result-chip {
            animation: popIn 0.22s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        /* Currency toggle */
        .currency-btn.active {
            background: var(--color-primary, #0071E3);
            color: white;
        }

        /* Auto-calc badge */
        .auto-badge {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 10px;
            font-weight: 700;
            color: var(--color-primary, #0071E3);
            background: rgba(0, 113, 227, 0.1);
            padding: 2px 6px;
            border-radius: 6px;
            letter-spacing: 0.5px;
        }

        /* Profit bar animation */
        .profit-bar-fill {
            transition: width 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .profit-positive {
            color: #008A00;
        }

        .profit-negative {
            color: #FF3B30;
        }

        /* Result card glow */
        .result-card-glow {
            box-shadow: 0 8px 32px rgba(0, 113, 227, 0.12), 0 2px 8px rgba(0, 0, 0, 0.06);
        }

        /* Hide number spinners */
        input[type=number]::-webkit-inner-spin-button,
        input[type=number]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        input[type=number] {
            -moz-appearance: textfield;
        }

        .section-divider {
            border-color: rgba(0, 0, 0, 0.06);
        }

        /* Garment type chips */
        .garment-chip {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            border-radius: 24px;
            border: 1px solid rgba(0,0,0,0.08);
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            font-size: 13px;
            font-weight: 600;
            color: var(--color-on-surface-variant, #49454F);
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            -webkit-tap-highlight-color: transparent;
            white-space: nowrap;
            box-shadow: inset 0 2px 4px rgba(255,255,255,0.6), 0 2px 8px rgba(0,0,0,0.02);
        }

        .garment-chip.active {
            background: var(--color-primary, #0071E3);
            border-color: var(--color-primary, #0071E3);
            color: white;
            box-shadow: 0 4px 12px rgba(0, 113, 227, 0.25), inset 0 2px 4px rgba(255,255,255,0.2);
            transform: translateY(-1px);
        }

        .garment-chip:hover:not(.active) {
            background: rgba(255, 255, 255, 0.95);
            border-color: rgba(0,0,0,0.15);
            transform: translateY(-1px);
        }

        .garment-chip:active {
            transform: scale(0.96) translateY(0);
        }

        /* Breakdown bar segments */
        .breakdown-seg {
            height: 100%;
            transition: width 0.5s cubic-bezier(0.34, 1.2, 0.64, 1);
        }

        .breakdown-seg:first-child {
            border-radius: 9999px 0 0 9999px;
        }

        .breakdown-seg:last-child {
            border-radius: 0 9999px 9999px 0;
        }

        .breakdown-seg:only-child {
            border-radius: 9999px;
        }
        body.bg-background {
            background-color: #f4f5f7;
            background-image: 
                radial-gradient(at 0% 0%, hsla(210, 100%, 93%, 1) 0, transparent 50%), 
                radial-gradient(at 100% 0%, hsla(280, 100%, 93%, 1) 0, transparent 50%),
                radial-gradient(at 100% 100%, hsla(30, 100%, 93%, 1) 0, transparent 50%),
                radial-gradient(at 0% 100%, hsla(160, 100%, 93%, 1) 0, transparent 50%);
            background-attachment: fixed;
        }
    </style>
</head>

<body class="font-body text-body antialiased bg-background" style="padding-bottom: 310px;">

    <div id="topbar-container"></div>

    <div class="mobile-wrapper">
        <main id="main-content-area" class="flex-1 p-md flex flex-col gap-lg">

            <!-- ── Header ── -->
            <div class="px-xs pt-sm flex justify-between items-start">
                <div>
                    <h2 class="text-[28px] leading-tight font-semibold tracking-tight text-on-surface mb-1">Costing</h2>
                    <p class="text-[14px] text-secondary" id="calc-subtitle">Profit/Cost Calculator</p>
                </div>
                <!-- Saved Costings Button -->
                <button onclick="window.location.href = 'costings.html'" 
                    class="flex items-center gap-1.5 bg-white/60 backdrop-blur-xl border border-white/50 shadow-sm rounded-xl px-3 py-2 active-scale transition-apple">
                    <span class="material-symbols-outlined text-[18px] text-primary">folder_open</span>
                    <span class="text-[13px] font-bold text-on-surface">Saved Costings</span>
                </button>
            </div>

                        <!-- ════════════════════════════════════════ -->
            <!-- UNIFIED CALCULATOR FORM                 -->
            <!-- ════════════════════════════════════════ -->
            <form id="unified-calc-form" onsubmit="event.preventDefault();" class="flex flex-col gap-lg">
                <!-- ── Order Info ── -->
                <div id="shared-order-info" class="bg-white/60 backdrop-blur-xl border border-white/50 rounded-[28px] shadow-[0_8px_30px_rgb(0,0,0,0.04)] p-md flex flex-col gap-4">
                    <h3 class="text-[15px] font-bold text-on-surface flex items-center gap-2">
                        <span class="material-symbols-outlined text-[18px] text-secondary">info</span>
                        Garment &amp; Specs
                    </h3>
                    <div class="grid grid-cols-2 gap-3">
                        <div class="col-span-2">
                            <label class="field-label">Client / Style Name</label>
                            <input id="shared-client" type="text" placeholder="e.g. Chennai Silks" class="calc-input w-full">
                        </div>
                        <div>
                            <label class="field-label">Total Quantity (pcs)</label>
                            <input id="shared-qty" type="number" min="0" placeholder="200" class="calc-input w-full" oninput="onSharedQtyChange()">
                        </div>
                        <div>
                            <label class="field-label">Pcs per Kg</label>
                            <input id="u-pcs-per-kg" type="number" min="0" step="0.1" placeholder="2.5" class="calc-input w-full" oninput="calcUnified()">
                        </div>
                    </div>
                    <!-- Auto kg info -->
                    <div id="u-kg-info" class="hidden bg-primary/5 border border-primary/20 rounded-xl px-4 py-2.5 flex justify-between items-center">
                        <span class="text-[13px] text-secondary font-medium">Total Fabric Required</span>
                        <span id="u-kg-val" class="text-[15px] font-bold text-primary">— kg</span>
                    </div>
                    <!-- Garment Type -->
                    <div>
                        <label class="field-label">Garment Type</label>
                        <div class="flex gap-2 flex-wrap mt-1" id="shared-garment-chips">
                            <button type="button" class="garment-chip active" data-type="T-Shirt" onclick="selectGarmentType(this)">👕 T-Shirt</button>
                            <button type="button" class="garment-chip" data-type="Polo" onclick="selectGarmentType(this)">🎽 Polo</button>
                            <button type="button" class="garment-chip" data-type="Hoodie" onclick="selectGarmentType(this)">🧥 Hoodie</button>
                            <button type="button" class="garment-chip" data-type="Jacket" onclick="selectGarmentType(this)">🧣 Jacket</button>
                            <button type="button" class="garment-chip" data-type="Shorts" onclick="selectGarmentType(this)">🩳 Shorts</button>
                        </div>
                    </div>
                </div>

                <!-- ── Fabric Cost ── -->
                <div class="bg-white/60 backdrop-blur-xl border border-white/50 rounded-[28px] shadow-[0_8px_30px_rgb(0,0,0,0.04)] overflow-hidden">
                    <button type="button" class="section-toggle w-full flex justify-between items-center p-md" onclick="toggleSection(this)">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 rounded-full bg-primary/10 text-primary flex items-center justify-center">
                                <span class="material-symbols-outlined text-[20px]">layers</span>
                            </div>
                            <div class="text-left">
                                <h3 class="text-[16px] font-semibold text-on-surface">Fabric</h3>
                                <p class="text-[12px] text-secondary">Cost/pc = Price/kg ÷ Pcs/kg × (1 + Wastage%)</p>
                            </div>
                        </div>
                        <div class="flex items-center gap-3">
                            <span class="material-symbols-outlined text-secondary expand-icon" style="transform:rotate(180deg)">expand_more</span>
                        </div>
                    </button>
                    <div class="section-body p-md pt-0 border-t border-outline-variant/30 flex flex-col gap-4 mt-2">
                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="field-label">Fabric Price / kg</label>
                                <div class="relative">
                                    <span class="curr-sym absolute left-3.5 top-1/2 -translate-y-1/2 text-secondary text-[15px] font-semibold">₹</span>
                                    <input id="u-fabric-price-kg" type="number" min="0" placeholder="420" class="calc-input w-full pl-8" oninput="calcUnified()">
                                </div>
                            </div>
                            <div>
                                <label class="field-label">Wastage %</label>
                                <div class="relative">
                                    <input id="u-wastage" type="number" min="0" placeholder="5" class="calc-input w-full pr-8" oninput="calcUnified()">
                                    <span class="absolute right-3.5 top-1/2 -translate-y-1/2 text-secondary text-[15px] font-semibold">%</span>
                                </div>
                            </div>
                        </div>
                        <div class="grid grid-cols-2 gap-3 items-end">
                            <div>
                                <label class="field-label flex justify-between">
                                    <span>Fabric Cost / pc</span>
                                    <span class="auto-badge relative transform-none top-0 right-0 inline-block ml-2">AUTO</span>
                                </label>
                                <div class="relative">
                                    <span class="curr-sym absolute left-3.5 top-1/2 -translate-y-1/2 text-secondary text-[15px] font-semibold">₹</span>
                                    <input id="u-fabric-cost-pc" type="number" class="calc-input w-full pl-8 bg-surface-container-lowest text-on-surface font-bold" placeholder="0.00" oninput="onFabricOverride('pc')">
                                </div>
                            </div>
                            <div>
                                <label class="field-label flex justify-between">
                                    <span>Total Cost</span>
                                    <span class="auto-badge relative transform-none top-0 right-0 inline-block ml-2">AUTO</span>
                                </label>
                                <div class="relative">
                                    <span class="curr-sym absolute left-3.5 top-1/2 -translate-y-1/2 text-secondary text-[15px] font-semibold">₹</span>
                                    <input id="u-fabric-cost-total" type="number" class="calc-input w-full pl-8 bg-surface-container-lowest text-on-surface font-bold" placeholder="0.00" oninput="onFabricOverride('total')">
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- ── Making / CMT ── -->
                <div class="bg-white/60 backdrop-blur-xl border border-white/50 rounded-[28px] shadow-[0_8px_30px_rgb(0,0,0,0.04)] overflow-hidden">
                    <button type="button" class="section-toggle w-full flex justify-between items-center p-md" onclick="toggleSection(this)">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 rounded-full bg-[#FF9F0A]/10 text-[#FF9F0A] flex items-center justify-center">
                                <span class="material-symbols-outlined text-[20px]">content_cut</span>
                            </div>
                            <div class="text-left">
                                <h3 class="text-[16px] font-semibold text-on-surface">Making / CMT</h3>
                                <p class="text-[12px] text-secondary">Cutting, Making, Trims</p>
                            </div>
                        </div>
                        <div class="flex items-center gap-3">
                            <span class="material-symbols-outlined text-secondary expand-icon" style="transform:rotate(180deg)">expand_more</span>
                        </div>
                    </button>
                    <div class="section-body p-md pt-0 border-t border-outline-variant/30 flex flex-col gap-4 mt-2">
                        <!-- Mode Toggle -->
                        <div class="flex bg-surface-container-high border border-outline-variant rounded-[12px] p-1 gap-1 w-full mb-2">
                            <button type="button" onclick="setCMTMode('combined')" class="cmt-toggle-btn active bg-primary text-white flex-1 text-[13px] font-semibold py-1.5 rounded-[8px] transition-all duration-200">
                                Combined CMT
                            </button>
                            <button type="button" onclick="setCMTMode('separate')" class="cmt-toggle-btn text-secondary bg-surface flex-1 text-[13px] font-semibold py-1.5 rounded-[8px] transition-all duration-200">
                                Separate Fields
                            </button>
                        </div>
                        
                        <!-- COMBINED -->
                        <div id="cmt-combined">
                            <div class="grid grid-cols-2 gap-3 items-end">
                                <div>
                                    <label class="field-label">CMT / pc</label>
                                    <div class="relative">
                                        <span class="curr-sym absolute left-3.5 top-1/2 -translate-y-1/2 text-secondary text-[15px] font-semibold">₹</span>
                                        <input id="u-cmt" type="number" min="0" placeholder="25" class="calc-input w-full pl-8" oninput="syncField('u-cmt', 'u-cmt-total', 'pc')">
                                    </div>
                                </div>
                                <div>
                                    <label class="field-label">Total</label>
                                    <div class="relative">
                                        <span class="curr-sym absolute left-3.5 top-1/2 -translate-y-1/2 text-secondary text-[15px] font-semibold">₹</span>
                                        <input id="u-cmt-total" type="number" min="0" placeholder="0" class="calc-input w-full pl-8" oninput="syncField('u-cmt', 'u-cmt-total', 'total')">
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- SEPARATE -->
                        <div id="cmt-separate" style="display:none;" class="flex flex-col gap-4">
                            <div class="grid grid-cols-2 gap-3 items-end">
                                <div>
                                    <label class="field-label">Cutting / pc</label>
                                    <div class="relative">
                                        <span class="curr-sym absolute left-3.5 top-1/2 -translate-y-1/2 text-secondary text-[15px] font-semibold">₹</span>
                                        <input id="u-cutting" type="number" min="0" placeholder="5" class="calc-input w-full pl-8" oninput="syncField('u-cutting', 'u-cutting-total', 'pc')">
                                    </div>
                                </div>
                                <div>
                                    <label class="field-label">Total</label>
                                    <div class="relative">
                                        <span class="curr-sym absolute left-3.5 top-1/2 -translate-y-1/2 text-secondary text-[15px] font-semibold">₹</span>
                                        <input id="u-cutting-total" type="number" min="0" placeholder="0" class="calc-input w-full pl-8" oninput="syncField('u-cutting', 'u-cutting-total', 'total')">
                                    </div>
                                </div>
                            </div>
                            <div class="grid grid-cols-2 gap-3 items-end">
                                <div>
                                    <label class="field-label">Fusing / pc</label>
                                    <div class="relative">
                                        <span class="curr-sym absolute left-3.5 top-1/2 -translate-y-1/2 text-secondary text-[15px] font-semibold">₹</span>
                                        <input id="u-fusing" type="number" min="0" placeholder="2" class="calc-input w-full pl-8" oninput="syncField('u-fusing', 'u-fusing-total', 'pc')">
                                    </div>
                                </div>
                                <div>
                                    <label class="field-label">Total</label>
                                    <div class="relative">
                                        <span class="curr-sym absolute left-3.5 top-1/2 -translate-y-1/2 text-secondary text-[15px] font-semibold">₹</span>
                                        <input id="u-fusing-total" type="number" min="0" placeholder="0" class="calc-input w-full pl-8" oninput="syncField('u-fusing', 'u-fusing-total', 'total')">
                                    </div>
                                </div>
                            </div>
                            <div class="grid grid-cols-2 gap-3 items-end">
                                <div>
                                    <label class="field-label">Wages / pc</label>
                                    <div class="relative">
                                        <span class="curr-sym absolute left-3.5 top-1/2 -translate-y-1/2 text-secondary text-[15px] font-semibold">₹</span>
                                        <input id="u-wages" type="number" min="0" placeholder="12" class="calc-input w-full pl-8" oninput="syncField('u-wages', 'u-wages-total', 'pc')">
                                    </div>
                                </div>
                                <div>
                                    <label class="field-label">Total</label>
                                    <div class="relative">
                                        <span class="curr-sym absolute left-3.5 top-1/2 -translate-y-1/2 text-secondary text-[15px] font-semibold">₹</span>
                                        <input id="u-wages-total" type="number" min="0" placeholder="0" class="calc-input w-full pl-8" oninput="syncField('u-wages', 'u-wages-total', 'total')">
                                    </div>
                                </div>
                            </div>
                            <div class="grid grid-cols-2 gap-3 items-end">
                                <div>
                                    <label class="field-label">Packing / pc</label>
                                    <div class="relative">
                                        <span class="curr-sym absolute left-3.5 top-1/2 -translate-y-1/2 text-secondary text-[15px] font-semibold">₹</span>
                                        <input id="u-packing" type="number" min="0" placeholder="3" class="calc-input w-full pl-8" oninput="syncField('u-packing', 'u-packing-total', 'pc')">
                                    </div>
                                </div>
                                <div>
                                    <label class="field-label">Total</label>
                                    <div class="relative">
                                        <span class="curr-sym absolute left-3.5 top-1/2 -translate-y-1/2 text-secondary text-[15px] font-semibold">₹</span>
                                        <input id="u-packing-total" type="number" min="0" placeholder="0" class="calc-input w-full pl-8" oninput="syncField('u-packing', 'u-packing-total', 'total')">
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- ── Printing & Sublimation ── -->
                <div class="bg-white/60 backdrop-blur-xl border border-white/50 rounded-[28px] shadow-[0_8px_30px_rgb(0,0,0,0.04)] overflow-hidden">
                    <button type="button" class="section-toggle w-full flex justify-between items-center p-md" onclick="toggleSection(this)">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 rounded-full bg-[#AF52DE]/10 text-[#AF52DE] flex items-center justify-center">
                                <span class="material-symbols-outlined text-[20px]">palette</span>
                            </div>
                            <div class="text-left">
                                <h3 class="text-[16px] font-semibold text-on-surface">Printing &amp; Sublimation</h3>
                                <p class="text-[12px] text-secondary">Colors, gradients, artwork</p>
                            </div>
                        </div>
                        <div class="flex items-center gap-3">
                            <span class="material-symbols-outlined text-secondary expand-icon" style="transform:rotate(0deg)">expand_more</span>
                        </div>
                    </button>
                    <div class="section-body p-md pt-0 border-t border-outline-variant/30 flex flex-col gap-4 mt-2" style="display:none;">
                        <div class="grid grid-cols-2 gap-3 items-end">
                            <div>
                                <label class="field-label">Printing / pc</label>
                                <div class="relative">
                                    <span class="curr-sym absolute left-3.5 top-1/2 -translate-y-1/2 text-secondary text-[15px] font-semibold">₹</span>
                                    <input id="u-printing" type="number" min="0" placeholder="0" class="calc-input w-full pl-8" oninput="syncField('u-printing', 'u-printing-total', 'pc')">
                                </div>
                            </div>
                            <div>
                                <label class="field-label">Total</label>
                                <div class="relative">
                                    <span class="curr-sym absolute left-3.5 top-1/2 -translate-y-1/2 text-secondary text-[15px] font-semibold">₹</span>
                                    <input id="u-printing-total" type="number" min="0" placeholder="0" class="calc-input w-full pl-8" oninput="syncField('u-printing', 'u-printing-total', 'total')">
                                </div>
                            </div>
                        </div>
                        <div class="grid grid-cols-2 gap-3 items-end">
                            <div>
                                <label class="field-label">Sublimation / pc</label>
                                <div class="relative">
                                    <span class="curr-sym absolute left-3.5 top-1/2 -translate-y-1/2 text-secondary text-[15px] font-semibold">₹</span>
                                    <input id="u-sublimation" type="number" min="0" placeholder="0" class="calc-input w-full pl-8" oninput="syncField('u-sublimation', 'u-sublimation-total', 'pc')">
                                </div>
                            </div>
                            <div>
                                <label class="field-label">Total</label>
                                <div class="relative">
                                    <span class="curr-sym absolute left-3.5 top-1/2 -translate-y-1/2 text-secondary text-[15px] font-semibold">₹</span>
                                    <input id="u-sublimation-total" type="number" min="0" placeholder="0" class="calc-input w-full pl-8" oninput="syncField('u-sublimation', 'u-sublimation-total', 'total')">
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- ── Accessories & Pattern ── -->
                <div class="bg-white/60 backdrop-blur-xl border border-white/50 rounded-[28px] shadow-[0_8px_30px_rgb(0,0,0,0.04)] overflow-hidden">
                    <button type="button" class="section-toggle w-full flex justify-between items-center p-md" onclick="toggleSection(this)">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 rounded-full bg-[#34C759]/10 text-[#34C759] flex items-center justify-center">
                                <span class="material-symbols-outlined text-[20px]">style</span>
                            </div>
                            <div class="text-left">
                                <h3 class="text-[16px] font-semibold text-on-surface">Accessories &amp; Pattern</h3>
                                <p class="text-[12px] text-secondary">Labels, buttons, design</p>
                            </div>
                        </div>
                        <div class="flex items-center gap-3">
                            <span class="material-symbols-outlined text-secondary expand-icon" style="transform:rotate(0deg)">expand_more</span>
                        </div>
                    </button>
                    <div class="section-body p-md pt-0 border-t border-outline-variant/30 flex flex-col gap-4 mt-2" style="display:none;">
                        <div class="grid grid-cols-2 gap-3 items-end">
                            <div>
                                <label class="field-label">Acc 1 / Order</label>
                                <div class="relative">
                                    <span class="curr-sym absolute left-3.5 top-1/2 -translate-y-1/2 text-secondary text-[15px] font-semibold">₹</span>
                                    <input id="u-acc1" type="number" min="0" placeholder="0" class="calc-input w-full pl-8" oninput="syncField('u-acc1-pc', 'u-acc1', 'total')">
                                </div>
                            </div>
                            <div>
                                <label class="field-label">Per pc</label>
                                <div class="relative">
                                    <span class="curr-sym absolute left-3.5 top-1/2 -translate-y-1/2 text-secondary text-[15px] font-semibold">₹</span>
                                    <input id="u-acc1-pc" type="number" min="0" placeholder="0" class="calc-input w-full pl-8" oninput="syncField('u-acc1-pc', 'u-acc1', 'pc')">
                                </div>
                            </div>
                        </div>
                        <div class="grid grid-cols-2 gap-3 items-end">
                            <div>
                                <label class="field-label">Acc 2 / Order</label>
                                <div class="relative">
                                    <span class="curr-sym absolute left-3.5 top-1/2 -translate-y-1/2 text-secondary text-[15px] font-semibold">₹</span>
                                    <input id="u-acc2" type="number" min="0" placeholder="0" class="calc-input w-full pl-8" oninput="syncField('u-acc2-pc', 'u-acc2', 'total')">
                                </div>
                            </div>
                            <div>
                                <label class="field-label">Per pc</label>
                                <div class="relative">
                                    <span class="curr-sym absolute left-3.5 top-1/2 -translate-y-1/2 text-secondary text-[15px] font-semibold">₹</span>
                                    <input id="u-acc2-pc" type="number" min="0" placeholder="0" class="calc-input w-full pl-8" oninput="syncField('u-acc2-pc', 'u-acc2', 'pc')">
                                </div>
                            </div>
                        </div>
                        <div class="grid grid-cols-2 gap-3 items-end">
                            <div>
                                <label class="field-label">Acc 3 / Order</label>
                                <div class="relative">
                                    <span class="curr-sym absolute left-3.5 top-1/2 -translate-y-1/2 text-secondary text-[15px] font-semibold">₹</span>
                                    <input id="u-acc3" type="number" min="0" placeholder="0" class="calc-input w-full pl-8" oninput="syncField('u-acc3-pc', 'u-acc3', 'total')">
                                </div>
                            </div>
                            <div>
                                <label class="field-label">Per pc</label>
                                <div class="relative">
                                    <span class="curr-sym absolute left-3.5 top-1/2 -translate-y-1/2 text-secondary text-[15px] font-semibold">₹</span>
                                    <input id="u-acc3-pc" type="number" min="0" placeholder="0" class="calc-input w-full pl-8" oninput="syncField('u-acc3-pc', 'u-acc3', 'pc')">
                                </div>
                            </div>
                        </div>
                        <div class="grid grid-cols-2 gap-3 items-end">
                            <div>
                                <label class="field-label">Pattern / Order</label>
                                <div class="relative">
                                    <span class="curr-sym absolute left-3.5 top-1/2 -translate-y-1/2 text-secondary text-[15px] font-semibold">₹</span>
                                    <input id="u-pattern" type="number" min="0" placeholder="0" class="calc-input w-full pl-8" oninput="calcUnified()">
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- ── Allowances & Overheads ── -->
                <div class="bg-white/60 backdrop-blur-xl border border-white/50 rounded-[28px] shadow-[0_8px_30px_rgb(0,0,0,0.04)] overflow-hidden">
                    <button type="button" class="section-toggle w-full flex justify-between items-center p-md" onclick="toggleSection(this)">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 rounded-full bg-[#5856D6]/10 text-[#5856D6] flex items-center justify-center">
                                <span class="material-symbols-outlined text-[20px]">account_balance_wallet</span>
                            </div>
                            <div class="text-left">
                                <h3 class="text-[16px] font-semibold text-on-surface">Allowances &amp; Overheads</h3>
                                <p class="text-[12px] text-secondary">Extra buffer, fixed costs</p>
                            </div>
                        </div>
                        <div class="flex items-center gap-3">
                            <span class="material-symbols-outlined text-secondary expand-icon" style="transform:rotate(0deg)">expand_more</span>
                        </div>
                    </button>
                    <div class="section-body p-md pt-0 border-t border-outline-variant/30 flex flex-col gap-4 mt-2" style="display:none;">
                        <div class="grid grid-cols-2 gap-3 items-end">
                            <div>
                                <label class="field-label">Allowances / pc</label>
                                <div class="relative">
                                    <span class="curr-sym absolute left-3.5 top-1/2 -translate-y-1/2 text-secondary text-[15px] font-semibold">₹</span>
                                    <input id="u-allowances" type="number" min="0" placeholder="0" class="calc-input w-full pl-8" oninput="syncField('u-allowances', 'u-allowances-total', 'pc')">
                                </div>
                            </div>
                            <div>
                                <label class="field-label">Total</label>
                                <div class="relative">
                                    <span class="curr-sym absolute left-3.5 top-1/2 -translate-y-1/2 text-secondary text-[15px] font-semibold">₹</span>
                                    <input id="u-allowances-total" type="number" min="0" placeholder="0" class="calc-input w-full pl-8" oninput="syncField('u-allowances', 'u-allowances-total', 'total')">
                                </div>
                            </div>
                        </div>
                        <div class="grid grid-cols-2 gap-3 items-end">
                            <div>
                                <label class="field-label">Overheads / pc</label>
                                <div class="relative">
                                    <span class="curr-sym absolute left-3.5 top-1/2 -translate-y-1/2 text-secondary text-[15px] font-semibold">₹</span>
                                    <input id="u-overheads" type="number" min="0" placeholder="0" class="calc-input w-full pl-8" oninput="syncField('u-overheads', 'u-overheads-total', 'pc')">
                                </div>
                            </div>
                            <div>
                                <label class="field-label">Total</label>
                                <div class="relative">
                                    <span class="curr-sym absolute left-3.5 top-1/2 -translate-y-1/2 text-secondary text-[15px] font-semibold">₹</span>
                                    <input id="u-overheads-total" type="number" min="0" placeholder="0" class="calc-input w-full pl-8" oninput="syncField('u-overheads', 'u-overheads-total', 'total')">
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- ── Selling Price ── -->
                <div class="bg-white/60 backdrop-blur-xl border border-white/50 rounded-[28px] shadow-[0_8px_30px_rgb(0,0,0,0.04)] p-md flex flex-col gap-4">
                    <h3 class="text-[15px] font-bold text-on-surface flex items-center gap-2">
                        <span class="material-symbols-outlined text-[18px] text-[#34C759]">sell</span>
                        Selling Price &amp; Margin
                    </h3>
                    <div class="grid grid-cols-3 gap-3">
                        <div class="col-span-1">
                            <label class="field-label">SP / pc</label>
                            <div class="relative">
                                <span class="curr-sym absolute left-3.5 top-1/2 -translate-y-1/2 text-secondary text-[15px] font-semibold">₹</span>
                                <input id="u-sp-pc" type="number" min="0" step="0.01" placeholder="180" class="calc-input w-full pl-8" oninput="onUSPChange('sp-pc')">
                            </div>
                        </div>
                        <div class="col-span-1">
                            <label class="field-label">Total SP</label>
                            <div class="relative">
                                <span class="curr-sym absolute left-3.5 top-1/2 -translate-y-1/2 text-secondary text-[15px] font-semibold">₹</span>
                                <input id="u-sp-total" type="number" min="0" step="0.01" placeholder="18000" class="calc-input w-full pl-8" oninput="onUSPChange('sp-total')">
                            </div>
                        </div>
                        <div class="col-span-1">
                            <label class="field-label">Profit %</label>
                            <div class="relative">
                                <input id="u-profit-pct" type="number" min="0" step="0.5" placeholder="30" class="calc-input w-full pr-8" oninput="onUSPChange('pct')">
                                <span class="absolute right-3.5 top-1/2 -translate-y-1/2 text-secondary text-[15px] font-semibold">%</span>
                            </div>
                        </div>
                    </div>
                    <div>
                        <div class="flex justify-between text-[12px] text-secondary font-medium mb-1.5">
                            <span>Profit Margin</span>
                            <span id="u-margin-label" class="font-bold text-secondary">—</span>
                        </div>
                        <div class="w-full bg-surface-container h-2.5 rounded-full overflow-hidden">
                            <div id="u-profit-bar" class="profit-bar-fill h-full rounded-full bg-primary" style="width:0%"></div>
                        </div>
                    </div>
                </div>

                <!-- ── Cost Breakdown ── -->
                <div id="u-breakdown" class="bg-white/60 backdrop-blur-xl border border-white/50 rounded-[28px] shadow-[0_8px_30px_rgb(0,0,0,0.04)] p-md hidden flex-col gap-4">
                    <div class="flex justify-between items-center">
                        <h3 class="text-[15px] font-bold text-on-surface flex items-center gap-2">
                            <span class="material-symbols-outlined text-[18px] text-secondary">donut_small</span>
                            Cost Breakdown
                        </h3>
                        <span id="u-breakdown-total" class="text-[13px] font-bold text-on-surface"></span>
                    </div>
                    <div id="u-breakdown-bar" class="w-full h-5 rounded-full overflow-hidden flex"></div>
                    <div id="u-breakdown-legend" class="flex flex-col gap-3"></div>
                </div>
            </form>

            <!-- Actions (Moved here for compact layout) -->
            <div class="flex gap-2 pt-4 pb-12 w-full">
                <button onclick="resetCalc()" title="Reset"
                    class="w-12 h-12 rounded-xl bg-white/60 backdrop-blur-xl border border-white/50 shadow-sm flex items-center justify-center text-secondary active-scale transition-apple flex-shrink-0">
                    <span class="material-symbols-outlined text-[20px]">restart_alt</span>
                </button>
                <button onclick="saveCosting()"
                    class="flex-1 bg-white/60 backdrop-blur-xl border border-white/50 shadow-sm text-on-surface font-semibold py-3 rounded-xl active-scale transition-apple text-[15px]">
                    Save Costing
                </button>
                <button onclick="openQuotePreview()"
                    class="flex-1 bg-primary text-on-primary font-semibold py-3 rounded-xl active-scale transition-apple shadow-md shadow-primary/20 text-[15px] flex items-center justify-center gap-1.5">
                    <span class="material-symbols-outlined text-[18px]">receipt</span>
                    Quote
                </button>
            </div>

        </main>
    </div>


    <!-- ════════════════════════════════════════ -->
    <!-- FLOATING RESULT CARD                    -->
    <!-- ════════════════════════════════════════ -->
    <div class="floating-results px-md pb-2">
        <div class="dynamic-island overflow-hidden">

            <!-- Primary metrics -->
            <div class="flex divide-x divide-outline-variant/40">
                <div class="flex-1 px-3 py-3 text-center">
                    <p class="text-[10px] font-semibold text-secondary uppercase tracking-wider mb-0.5">CP / pc</p>
                    <p id="result-cp" class="text-[19px] font-bold text-on-surface transition-all duration-300">—</p>
                </div>
                <div class="flex-1 px-3 py-3 text-center">
                    <p class="text-[10px] font-semibold text-secondary uppercase tracking-wider mb-0.5">SP / pc</p>
                    <p id="result-sp" class="text-[19px] font-bold text-primary transition-all duration-300">—</p>
                </div>
                <div class="flex-1 px-3 py-3 text-center">
                    <p class="text-[10px] font-semibold text-secondary uppercase tracking-wider mb-0.5">Profit %</p>
                    <p id="result-profit-pct" class="text-[19px] font-bold transition-all duration-300 text-secondary">—
                    </p>
                </div>
            </div>

            <!-- Secondary metrics (order totals / pp totals when qty entered) -->
            <div id="result-summary-row" class="hidden md:flex border-t border-outline-variant/20">
                <div class="flex w-full divide-x divide-outline-variant/20">
                    <div class="flex-1 px-2 py-2 text-center">
                        <p class="text-[9px] font-semibold text-secondary uppercase tracking-wider mb-0.5"
                            id="result-col1-label">Total Cost</p>
                        <p id="result-total-cost" class="text-[12px] font-bold text-on-surface">—</p>
                    </div>
                    <div class="flex-1 px-2 py-2 text-center">
                        <p class="text-[9px] font-semibold text-secondary uppercase tracking-wider mb-0.5">Revenue</p>
                        <p id="result-total-sales" class="text-[12px] font-bold text-on-surface">—</p>
                    </div>
                    <div class="flex-1 px-2 py-2 text-center">
                        <p class="text-[9px] font-semibold text-secondary uppercase tracking-wider mb-0.5">Profit</p>
                        <p id="result-profit-done" class="text-[12px] font-bold text-[#34C759]">—</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="bottom-nav-container"></div>
    <div id="sheets-container"></div>

    <script type="module" src="../js/calculator/index.js"></script>
    <script src="../js/utils/sheet.js"></script>
    <script src="../js/app.js"></script>
</body>

</html>

<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Advanced BOM Costing - Garment OS</title>

    <script>
      (function() {
        if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
        window.toggleTheme = window.toggleTheme || function() {
          const isDark = document.documentElement.classList.toggle('dark');
          localStorage.setItem('theme', isDark ? 'dark' : 'light');
          if (typeof window.updateThemeToggleUI === 'function') {
            window.updateThemeToggleUI(isDark);
          }
          window.dispatchEvent(new CustomEvent('gos-theme-changed', { detail: { isDark } }));
        };
      })();
    </script>

    <link rel="icon" type="image/png" sizes="192x192" href="../assets/icon-192.png">
    <link rel="icon" type="image/webp" href="../assets/logo-primary.webp">
    <meta name="theme-color" content="#0059b5">

    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet" />

    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script src="../js/tailwind.config.js"></script>

    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/typography.css">
    <link rel="stylesheet" href="../css/utilities.css">
    <link rel="stylesheet" href="../css/calculator.css">

</head>
<body class="font-body text-body antialiased bg-background dark:bg-slate-950 text-on-surface dark:text-slate-100 selection:bg-primary/20 print:bg-white print:text-black">

    <div id="sidebar-container" class="print:hidden"></div>
    <div id="topbar-container" class="print:hidden"></div>
    
    <div class="main-wrapper">
        <main class="page-container pb-32 print:pb-0 print:p-0 print:m-0 print:max-w-full">
            <!-- Header -->
            <div class="flex flex-col md:flex-row items-start md:items-center justify-between mb-4 mt-2 gap-4 print:hidden">
                <div class="flex flex-col w-full md:w-auto">
                    <div class="flex bg-surface-variant/40 dark:bg-slate-800/60 p-1 rounded-xl w-full md:w-fit mb-2 overflow-x-auto">
                        <button onclick="window.location.href='calculator.html'" class="flex-1 md:flex-none px-5 py-2 text-[13px] font-bold rounded-lg text-secondary dark:text-slate-400 hover:text-on-surface dark:hover:text-slate-200 transition-colors whitespace-nowrap">Quick</button>
                        <button class="flex-1 md:flex-none px-5 py-2 text-[13px] font-bold rounded-lg bg-surface dark:bg-slate-700 text-on-surface dark:text-slate-100 shadow-sm cursor-default whitespace-nowrap">Advanced</button>
                    </div>
                    <p class="text-[14px] text-secondary dark:text-slate-400 mt-1">Multi-fabric BOM, Size Ratio & Advanced CMT</p>
                </div>
                <div class="flex items-center gap-2 w-full md:w-auto overflow-x-auto pb-1 md:pb-0 hide-scrollbar">
                    <button id="btn-delete" class="hidden h-10 px-4 text-[13px] btn-secondary text-error hover:bg-error/10 border-error/20 mr-auto md:mr-0 shrink-0">Delete</button>
                    <button id="btn-print" onclick="window.print()" class="w-10 h-10 shrink-0 rounded-xl bg-surface-variant/30 text-secondary hover:bg-surface-variant/50 transition-colors flex items-center justify-center">
                        <span class="material-symbols-outlined text-[20px]">print</span>
                    </button>
                    <button id="btn-save-draft" class="btn-secondary h-10 px-4 text-[13px] shrink-0">Save Draft</button>
                    <button id="btn-create-quote" class="btn-primary h-10 px-4 text-[13px] bg-primary text-white rounded-xl font-semibold shadow-sm hover:opacity-90 active:scale-95 transition-all shrink-0">Create Quote</button>
                </div>
            </div>

            <!-- Global Inputs -->
            <div class="bg-surface dark:bg-slate-900 rounded-3xl p-5 mb-6 shadow-sm border border-outline-variant/30 dark:border-slate-800 print:shadow-none print:border-none print:p-0 print:mb-4">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="text-[12px] font-semibold text-on-surface dark:text-slate-300 ml-1 mb-1 block">Client / Buyer</label>
                        <input type="text" id="adv-client" placeholder="e.g. Acme Corp" class="w-full bg-surface-variant/30 dark:bg-slate-800 border-none rounded-2xl px-4 py-3 text-[15px] font-semibold outline-none focus:ring-2 focus:ring-primary/20 print:bg-transparent print:p-0 print:text-[18px]">
                    </div>
                    <div>
                        <label class="text-[12px] font-semibold text-on-surface dark:text-slate-300 ml-1 mb-1 block">Garment Type</label>
                        <input type="text" id="adv-garment-type" placeholder="e.g. Zip Hoodie" value="Garment" class="w-full bg-surface-variant/30 dark:bg-slate-800 border-none rounded-2xl px-4 py-3 text-[15px] font-semibold outline-none focus:ring-2 focus:ring-primary/20 print:bg-transparent print:p-0 print:text-[18px]">
                    </div>
                </div>
            </div>

            <!-- Modules Container (Rendered by JS) -->
            <div id="adv-modules-container" class="flex flex-col gap-6">
                <!-- Size Ratio Module -->
                <div id="mod-sizes"></div>
                <!-- Fabrics Module -->
                <div id="mod-fabrics"></div>
                <!-- Trims Module -->
                <div id="mod-trims"></div>
                <!-- CMT & VAS Module -->
                <div id="mod-vas"></div>
            </div>

        </main>
    </div>

    <!-- Fixed Bottom Result Bar -->
    <div class="fixed bottom-0 left-0 lg:left-[260px] right-0 bg-surface/90 dark:bg-slate-900/90 backdrop-blur-xl border-t border-outline-variant/30 dark:border-slate-800 p-3 sm:p-4 pb-safe-4 z-40 print:hidden">
        <div class="max-w-[1200px] mx-auto flex flex-col sm:flex-row items-center justify-between gap-3 sm:gap-4">
            <div class="flex items-center justify-between w-full sm:w-auto">
                <div class="flex flex-col">
                    <span class="text-[11px] font-semibold text-secondary uppercase tracking-wider">Total Est. Cost</span>
                    <span id="adv-total-cost" class="text-[18px] sm:text-[20px] font-extrabold text-on-surface dark:text-slate-100">₹0.00</span>
                </div>
            </div>
            <div class="flex items-center gap-2 sm:gap-3 w-full sm:w-auto overflow-x-auto pb-1 sm:pb-0 hide-scrollbar shrink-0 justify-between sm:justify-end">
                <div class="flex flex-col items-end shrink-0">
                    <span class="text-[10px] sm:text-[11px] font-semibold text-secondary uppercase tracking-wider">Cost/pc</span>
                    <span id="adv-cost-pc" class="text-[14px] sm:text-[16px] font-bold text-on-surface dark:text-slate-100">₹0.00</span>
                </div>
                <div class="w-px h-8 sm:h-10 bg-outline-variant/30 dark:bg-slate-700 shrink-0"></div>
                <div class="flex flex-col items-end shrink-0">
                    <span class="text-[10px] sm:text-[11px] font-semibold text-secondary uppercase tracking-wider">Margin</span>
                    <div class="flex items-center justify-end">
                        <input type="number" id="adv-profit-pct" class="w-12 sm:w-16 h-6 sm:h-8 text-right bg-surface-variant/50 dark:bg-slate-800 border-none rounded-lg text-[13px] sm:text-[14px] font-bold outline-none px-1" value="30"><span class="ml-1 text-[13px]">%</span>
                    </div>
                </div>
                <div class="w-px h-8 sm:h-10 bg-outline-variant/30 dark:bg-slate-700 shrink-0"></div>
                <div class="flex flex-col items-end shrink-0">
                    <span class="text-[10px] sm:text-[11px] font-semibold text-secondary uppercase tracking-wider">SP/pc</span>
                    <span id="adv-sp-pc" class="text-[16px] sm:text-[18px] font-extrabold text-[#00B386]">₹0.00</span>
                </div>
            </div>
        </div>
    </div>

    <div id="bottom-nav-container" class="print:hidden"></div>
    <div id="sheets-container" class="print:hidden"></div>

    <script src="../js/app.js"></script>
    <script type="module" src="../js/stores/AdvancedCalculatorStore.js"></script>
    <script type="module" src="../js/advanced-calculator/index.js"></script>
    <script src="../js/utils/sheet.js"></script>
</body>
</html>

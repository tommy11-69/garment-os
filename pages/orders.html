<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Garment OS - Orders</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com" rel="preconnect"/>
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
    
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script src="../js/tailwind.config.js"></script>
    
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/typography.css">
    <link rel="stylesheet" href="../css/utilities.css">
</head>
<body class="font-body text-body antialiased">

    <div id="topbar-container"></div>

    <div class="mobile-wrapper">
        <main id="main-content-area" class="flex-1 p-md flex flex-col gap-lg">
            
            <div class="px-xs pt-sm">
                <h2 class="text-[28px] leading-tight font-semibold tracking-tight text-on-surface mb-1">Orders</h2>
                <p class="text-body text-secondary">42 Active Orders</p>
            </div>
            
            <!-- Mobile Segmented Control -->
            <div id="orders-segmented-control"></div>

            <!-- Order Cards List -->
            <div id="orders-list" class="flex flex-col gap-md"></div>

            <script type="module">
                import { SegmentedControl, StatusBadge, ProgressBar } from '../js/components/index.js';
                
                // Segmented Control
                document.getElementById('orders-segmented-control').innerHTML = SegmentedControl({
                    options: [
                        { id: 'all', label: 'All' },
                        { id: 'active', label: 'Active' },
                        { id: 'delayed', label: 'Delayed' }
                    ],
                    activeOption: 'all'
                });

                // Order Cards (Demo replacing two hardcoded cards)
                const ordersHtml = `
                    <div onclick="openSheet('orderDetailsSheet')" class="bg-surface-container-lowest rounded-[24px] border border-outline-variant p-lg shadow-sm active:bg-surface-variant transition-colors cursor-pointer">
                        <div class="flex items-start justify-between mb-4">
                            <div>
                                <span class="text-[13px] font-semibold text-primary mb-1 block">ORD-992</span>
                                <h3 class="text-[18px] font-bold text-on-surface leading-tight">Everlane Corp.</h3>
                            </div>
                            ${StatusBadge({ status: 'success', label: 'On Track' })}
                        </div>
                        
                        <div class="flex flex-col gap-3 mb-4">
                            <div class="flex justify-between items-center">
                                <span class="text-secondary text-[14px]">Amount</span>
                                <span class="text-on-surface font-semibold text-[15px]">$12,400</span>
                            </div>
                            <div class="flex justify-between items-center">
                                <span class="text-secondary text-[14px]">Delivery Date</span>
                                <span class="text-on-surface font-semibold text-[15px]">Oct 24, 2026</span>
                            </div>
                            <div class="flex justify-between items-center">
                                <span class="text-secondary text-[14px]">Units</span>
                                <span class="text-on-surface font-semibold text-[15px]">5,000</span>
                            </div>
                        </div>
                        
                        ${ProgressBar({ label: '65% Complete', secondaryLabel: 'Cutting Phase', percentage: 65, color: 'primary' })}
                    </div>

                    <div class="bg-surface-container-lowest rounded-[24px] border border-outline-variant p-lg shadow-sm active:bg-surface-variant transition-colors cursor-pointer">
                        <div class="flex items-start justify-between mb-4">
                            <div>
                                <span class="text-[13px] font-semibold text-primary mb-1 block">ORD-995</span>
                                <h3 class="text-[18px] font-bold text-on-surface leading-tight">Patagonia</h3>
                            </div>
                            ${StatusBadge({ status: 'warning', label: 'Delayed' })}
                        </div>
                        
                        <div class="flex flex-col gap-3 mb-4">
                            <div class="flex justify-between items-center">
                                <span class="text-secondary text-[14px]">Amount</span>
                                <span class="text-on-surface font-semibold text-[15px]">$8,950</span>
                            </div>
                            <div class="flex justify-between items-center">
                                <span class="text-secondary text-[14px]">Delivery Date</span>
                                <span class="text-[#FF9F0A] font-semibold text-[15px]">Oct 26, 2026</span>
                            </div>
                            <div class="flex justify-between items-center">
                                <span class="text-secondary text-[14px]">Units</span>
                                <span class="text-on-surface font-semibold text-[15px]">1,200</span>
                            </div>
                        </div>
                        
                        ${ProgressBar({ label: '', secondaryLabel: 'Sourcing Phase', percentage: 30, color: 'warning' })}
                    </div>
                `;
                document.getElementById('orders-list').innerHTML = ordersHtml;
            </script>
            
            <div class="h-6"></div>
        </main>
    </div>
    
    <div id="fab-container" data-icon="add" data-action="openSheet('createOrderSheet')"></div>
    <div id="bottom-nav-container"></div>


    <!-- ========================================== -->
    <!-- BOTTOM SHEETS -->
    <!-- ========================================== -->

    <div id="sheets-container"></div>
    
    <script type="module">
        import { BottomSheet, TimelineEvent } from '../js/components/index.js';
        import { TextInput, SelectInput, TextareaInput } from '../js/components/inputs.js';

        const sheetsContainer = document.getElementById('sheets-container');
        
        // Priority Control HTML Helper
        const priorityControl = (active = 'Normal') => `
            <div class="flex flex-col gap-2">
                <label class="text-[14px] font-semibold text-on-surface">Order Priority</label>
                <div class="flex bg-surface-variant p-1 rounded-xl w-full">
                    <button class="flex-1 py-1.5 text-[13px] font-semibold rounded-lg transition-all ${active === 'Normal' ? 'bg-surface-container-lowest shadow-sm text-on-surface' : 'text-secondary'}">Normal</button>
                    <button class="flex-1 py-1.5 text-[13px] font-semibold rounded-lg transition-all ${active === 'High' ? 'bg-surface-container-lowest shadow-sm text-on-surface' : 'text-secondary'}">High</button>
                    <button class="flex-1 py-1.5 text-[13px] font-semibold rounded-lg transition-all ${active === 'Urgent' ? 'bg-surface-container-lowest shadow-sm text-error' : 'text-secondary hover:text-error'}">Urgent</button>
                </div>
            </div>
        `;

        // Create Order Content
        const createOrderContent = `
            ${SelectInput({ label: 'Customer', id: 'create-customer', options: [{label: 'Select Customer...'}, {label: 'Everlane Corp.'}, {label: 'Patagonia'}, {label: 'Aethereal Collective'}] })}
            ${SelectInput({ label: 'Product Selection', id: 'create-product', options: [{label: 'Select Product Template...'}, {label: 'SS24-TS-01 (Cotton Jersey)'}, {label: 'AW25-JK-02 (Denim Jacket)'}] })}
            <div class="flex gap-4">
                <div class="flex-1">
                    ${TextInput({ label: 'Quantity', id: 'create-qty', type: 'number', placeholder: '1000' })}
                </div>
                <div class="flex-1">
                    ${TextInput({ label: 'Unit Price', id: 'create-price', type: 'number', placeholder: '$' })}
                </div>
            </div>
            ${TextInput({ label: 'Delivery Date', id: 'create-date', type: 'date' })}
            ${priorityControl('Normal')}
            ${TextareaInput({ label: 'Notes', id: 'create-notes', placeholder: 'Any special instructions...', rows: 2 })}
            <div class="h-10"></div>
        `;
        const createOrderFooter = `
            <button onclick="closeSheet('createOrderSheet')" class="w-full bg-primary text-on-primary font-bold text-[16px] py-4 rounded-2xl active:scale-[0.98] transition-transform shadow-sm">
                Create Order
            </button>
        `;

        // Edit Order Content
        const editOrderContent = `
            ${SelectInput({ label: 'Customer', id: 'edit-customer', options: [{label: 'Everlane Corp.', value: 'Everlane Corp.'}] })}
            ${SelectInput({ label: 'Product Selection', id: 'edit-product', options: [{label: 'SS24-TS-01 (Cotton Jersey)'}] })}
            <div class="flex gap-4">
                <div class="flex-1">
                    ${TextInput({ label: 'Quantity', id: 'edit-qty', type: 'number', value: '1200' })}
                </div>
                <div class="flex-1">
                    ${TextInput({ label: 'Unit Price', id: 'edit-price', type: 'number', value: '10.33' })}
                </div>
            </div>
            ${TextInput({ label: 'Delivery Date', id: 'edit-date', type: 'date', value: '2026-10-24' })}
            ${priorityControl('High')}
            ${TextareaInput({ label: 'Notes', id: 'edit-notes', value: 'Expedited shipping requested.', rows: 2 })}
            <div class="h-10"></div>
        `;
        const editOrderFooter = `
            <button onclick="closeSheet('editOrderSheet')" class="w-full bg-primary text-on-primary font-bold text-[16px] py-4 rounded-2xl active:scale-[0.98] transition-transform shadow-sm">
                Save Changes
            </button>
        `;

        // Order Details Content
        const orderDetailsHeader = `
        <div class="px-lg pb-md flex justify-between items-start border-b border-outline-variant/30">
            <div>
                <span class="text-[13px] font-bold text-primary mb-1 block">ORD-992</span>
                <h2 class="text-[22px] font-bold text-on-surface leading-tight">Everlane Corp.</h2>
                <span class="inline-block mt-2 px-3 py-1 rounded-full text-[12px] font-medium bg-success-container/30 text-success">On Track</span>
            </div>
            <div class="flex gap-2">
                <button onclick="openSheet('editOrderSheet')" class="w-8 h-8 rounded-full bg-primary/10 flex items-center justify-center text-primary active:scale-95 transition-transform">
                    <span class="material-symbols-outlined text-[18px]">edit</span>
                </button>
                <button onclick="openSheet('deleteOrderSheet')" class="w-8 h-8 rounded-full bg-error-container/30 flex items-center justify-center text-error active:scale-95 transition-transform">
                    <span class="material-symbols-outlined text-[18px]">delete</span>
                </button>
                <button onclick="closeSheet('orderDetailsSheet')" class="w-8 h-8 rounded-full bg-surface-variant flex items-center justify-center text-secondary active:scale-95 transition-transform">
                    <span class="material-symbols-outlined text-[20px]">close</span>
                </button>
            </div>
        </div>`;
        const orderDetailsContent = `
            <div class="grid grid-cols-2 gap-3">
                <div class="bg-surface-container-lowest p-4 rounded-[20px] border border-outline-variant shadow-sm">
                    <span class="text-[12px] font-semibold text-secondary uppercase tracking-wider mb-1 block">Total Amount</span>
                    <span class="text-[20px] font-bold text-on-surface">$12,400</span>
                </div>
                <div class="bg-surface-container-lowest p-4 rounded-[20px] border border-outline-variant shadow-sm">
                    <span class="text-[12px] font-semibold text-secondary uppercase tracking-wider mb-1 block">Delivery</span>
                    <span class="text-[18px] font-bold text-on-surface">Oct 24, 2026</span>
                </div>
            </div>

            <div class="bg-surface-container-lowest rounded-[24px] border border-outline-variant shadow-sm p-lg">
                <h3 class="text-[16px] font-bold text-on-surface mb-4">Production Timeline</h3>
                <div class="relative border-l-2 border-outline-variant ml-3 space-y-6">
                    ${TimelineEvent({ title: 'Sourcing Completed', time: 'Oct 10', isCompleted: true })}
                    ${TimelineEvent({ title: 'Cutting Phase', subtitle: '65% completed. Expected finish by tomorrow.', time: 'In Progress', isActive: true })}
                    ${TimelineEvent({ title: 'Sewing Phase' })}
                    ${TimelineEvent({ title: 'Quality Control' })}
                </div>
            </div>
            <div class="h-10"></div>
        `;
        const orderDetailsFooter = `
            <button onclick="closeSheet('orderDetailsSheet')" class="flex-1 bg-surface-container-high text-on-surface font-bold text-[15px] py-3.5 rounded-2xl active:scale-[0.98] transition-transform">
                Close
            </button>
            <button class="flex-1 bg-success text-on-primary font-bold text-[15px] py-3.5 rounded-2xl active:scale-[0.98] transition-transform shadow-sm">
                Update Status
            </button>
        `;

        // Delete Order Confirmation
        const deleteOrderContent = `
            <div class="flex flex-col items-center text-center gap-3 pt-4">
                <div class="w-16 h-16 rounded-full bg-error-container/30 text-error flex items-center justify-center mb-2">
                    <span class="material-symbols-outlined text-[32px]">delete</span>
                </div>
                <h3 class="text-[20px] font-bold text-on-surface">Delete Order ORD-992?</h3>
                <p class="text-[15px] text-secondary">Are you sure you want to delete this order? This action cannot be undone.</p>
                <div class="h-6"></div>
            </div>
        `;
        const deleteOrderFooter = `
            <button onclick="closeSheet('deleteOrderSheet')" class="flex-1 bg-surface-container-high text-on-surface font-bold text-[15px] py-3.5 rounded-2xl active:scale-[0.98] transition-transform">
                Cancel
            </button>
            <button onclick="closeSheet('deleteOrderSheet')" class="flex-1 bg-error text-on-error font-bold text-[15px] py-3.5 rounded-2xl active:scale-[0.98] transition-transform shadow-sm">
                Delete
            </button>
        `;

        // Render Sheets
        sheetsContainer.innerHTML = [
            BottomSheet({ id: 'createOrderSheet', title: 'Create Order', content: createOrderContent, footerContent: createOrderFooter }),
            BottomSheet({ id: 'editOrderSheet', title: 'Edit Order', content: editOrderContent, footerContent: editOrderFooter }),
            BottomSheet({ id: 'orderDetailsSheet', customHeader: orderDetailsHeader, content: orderDetailsContent, footerContent: orderDetailsFooter, height: '90vh' }),
            BottomSheet({ id: 'deleteOrderSheet', customHeader: '<div class="sheet-handle"></div>', content: deleteOrderContent, footerContent: deleteOrderFooter, height: 'auto' })
        ].join('');
    </script>

    <script src="../js/utils/sheet.js"></script>
    <script src="../js/app.js"></script>
</body>
</html>

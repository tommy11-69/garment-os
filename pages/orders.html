<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Garment OS - Orders</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com" rel="preconnect"/>
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
    
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script src="../js/tailwind.config.js"></script>
    
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/typography.css">
    <link rel="stylesheet" href="../css/utilities.css">
</head>
<body class="font-body text-body antialiased">

    <div id="topbar-container"></div>

    <div class="mobile-wrapper">
        <main id="main-content-area" class="flex-1 p-md flex flex-col gap-lg">
            
            <div class="px-xs pt-sm flex justify-between items-end">
                <div>
                    <h2 class="text-[28px] leading-tight font-semibold tracking-tight text-on-surface mb-1">Orders</h2>
                    <p id="orders-count" class="text-body text-secondary">Loading...</p>
                </div>
                <button onclick="window.toggleBulkMode()" id="bulk-toggle-btn" class="px-3 py-1.5 rounded-lg border border-outline-variant text-[13px] font-medium text-secondary active-bg flex items-center gap-1">
                    <span class="material-symbols-outlined text-[16px]">checklist</span>
                    Bulk
                </button>
            </div>

            <!-- Search & Filter Bar -->
            <div class="flex gap-2">
                <div class="relative flex-1">
                    <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-secondary text-[20px]">search</span>
                    <input type="text" id="order-search-input" placeholder="Search customer, ID, or style..." class="w-full pl-10 pr-4 py-2.5 bg-surface-container-lowest border border-outline-variant rounded-xl text-[14px] focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition-all placeholder:text-secondary/70">
                </div>
                <button onclick="window.openSheet('filterOrderSheet')" class="w-[46px] shrink-0 bg-surface-container-lowest border border-outline-variant rounded-xl flex items-center justify-center text-on-surface active-scale transition-apple">
                    <span class="material-symbols-outlined text-[20px]">tune</span>
                </button>
            </div>
            
            <!-- Mobile Segmented Control -->
            <div id="orders-segmented-control"></div>

            <!-- Order Cards List -->
            <div id="orders-list" class="flex flex-col gap-md"></div>


            
            <div class="h-6"></div>
        </main>
    </div>
    
    <div id="fab-container" data-icon="add" data-action="window.openSheet('fabActionSheet')"></div>
    <div id="bottom-nav-container"></div>

    <!-- Bulk Actions Toolbar -->
    <div id="bulk-actions-toolbar" class="hidden fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-surface border-t border-outline-variant/30 shadow-[0_-4px_20px_rgba(0,0,0,0.05)] z-[100] pb-6 pt-3 px-4 flex justify-between items-center transition-transform translate-y-full">
        <div class="flex items-center gap-2">
            <button onclick="window.selectAllOrders()" class="w-10 h-10 rounded-full flex items-center justify-center text-secondary active-bg">
                <span class="material-symbols-outlined text-[20px]">done_all</span>
            </button>
            <span id="bulk-selected-count" class="text-[14px] font-bold text-on-surface">0 Selected</span>
        </div>
        <div class="flex gap-1">
            <button onclick="window.bulkArchive()" title="Archive" class="flex flex-col items-center gap-0.5 px-2 py-1.5 rounded-xl text-secondary active-bg transition-colors">
                <span class="material-symbols-outlined text-[18px]">archive</span>
                <span class="text-[10px] font-medium">Archive</span>
            </button>
            <button onclick="window.bulkDelete()" title="Delete" class="flex flex-col items-center gap-0.5 px-2 py-1.5 rounded-xl text-error active-bg transition-colors">
                <span class="material-symbols-outlined text-[18px]">delete</span>
                <span class="text-[10px] font-medium">Delete</span>
            </button>
            <button onclick="window.bulkExport()" title="Export CSV" class="flex flex-col items-center gap-0.5 px-2 py-1.5 rounded-xl text-secondary active-bg transition-colors">
                <span class="material-symbols-outlined text-[18px]">download</span>
                <span class="text-[10px] font-medium">Export</span>
            </button>
            <button onclick="window.bulkPrint()" title="Print" class="flex flex-col items-center gap-0.5 px-2 py-1.5 rounded-xl text-secondary active-bg transition-colors">
                <span class="material-symbols-outlined text-[18px]">print</span>
                <span class="text-[10px] font-medium">Print</span>
            </button>
            <button onclick="window.bulkAssign()" title="Assign Production" class="flex flex-col items-center gap-0.5 px-2 py-1.5 rounded-xl text-secondary active-bg transition-colors">
                <span class="material-symbols-outlined text-[18px]">precision_manufacturing</span>
                <span class="text-[10px] font-medium">Assign</span>
            </button>
            <button onclick="window.bulkApprove()" title="Approve" class="flex flex-col items-center gap-0.5 px-2 py-1.5 rounded-xl bg-primary text-on-primary active-scale transition-apple shadow-sm rounded-xl">
                <span class="material-symbols-outlined text-[18px]">check_circle</span>
                <span class="text-[10px] font-bold">Approve</span>
            </button>
        </div>
    </div>


    <!-- ========================================== -->
    <!-- BOTTOM SHEETS -->
    <!-- ========================================== -->

    <div id="sheets-container"></div>
    
    <script type="module" src="../js/orders/index.js"></script>

    <script src="../js/utils/sheet.js"></script>
    <script src="../js/app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport" />
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Saved Costings - Garment OS</title>

    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script src="../js/tailwind.config.js"></script>

    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/typography.css">
    <link rel="stylesheet" href="../css/utilities.css">

    <style>
        body.bg-background {
            background-color: #f4f5f7;
            background-image: 
                radial-gradient(at 0% 0%, hsla(210, 100%, 93%, 1) 0, transparent 50%), 
                radial-gradient(at 100% 0%, hsla(280, 100%, 93%, 1) 0, transparent 50%),
                radial-gradient(at 100% 100%, hsla(30, 100%, 93%, 1) 0, transparent 50%),
                radial-gradient(at 0% 100%, hsla(160, 100%, 93%, 1) 0, transparent 50%);
            background-attachment: fixed;
        }

        .costing-card {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            border-radius: 24px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.04);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            cursor: pointer;
        }

        .costing-card:active {
            transform: scale(0.98);
        }

        .shimmer {
            background: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.4) 50%, rgba(255,255,255,0) 100%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite linear;
        }
        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }
    </style>
</head>

<body class="font-body text-body antialiased bg-background pb-32">

    <div id="topbar-container"></div>

    <div class="mobile-wrapper">
        <main id="main-content-area" class="flex-1 p-md flex flex-col gap-md">
            
            <div class="px-xs pt-sm flex justify-between items-center mb-2">
                <div>
                    <h2 class="text-[28px] leading-tight font-semibold tracking-tight text-on-surface mb-1">Costings</h2>
                    <p class="text-[14px] text-secondary">Your saved calculators</p>
                </div>
                <button onclick="window.location.href = 'calculator.html'" class="w-10 h-10 rounded-full bg-primary flex items-center justify-center text-white shadow-md active-scale transition-apple">
                    <span class="material-symbols-outlined text-[24px]">add</span>
                </button>
            </div>

            <!-- Loading State -->
            <div id="loading-state" class="flex flex-col gap-4 hidden">
                <div class="w-full h-32 rounded-[24px] bg-white/40 shimmer"></div>
                <div class="w-full h-32 rounded-[24px] bg-white/40 shimmer"></div>
                <div class="w-full h-32 rounded-[24px] bg-white/40 shimmer"></div>
            </div>

            <!-- Empty State -->
            <div id="empty-state" class="hidden flex flex-col items-center justify-center py-20 px-6 text-center">
                <div class="w-20 h-20 rounded-full bg-primary/10 flex items-center justify-center mb-4">
                    <span class="material-symbols-outlined text-[40px] text-primary">folder_off</span>
                </div>
                <h3 class="text-[18px] font-bold text-on-surface mb-2">No Costings Saved</h3>
                <p class="text-[14px] text-secondary mb-6">You haven't saved any costing sheets yet.</p>
                <button onclick="window.location.href = 'calculator.html'" class="bg-primary text-white font-semibold px-6 py-3 rounded-xl shadow-md active-scale transition-apple">
                    Create Costing
                </button>
            </div>

            <!-- Costings List -->
            <div id="costings-list" class="flex flex-col gap-3"></div>

        </main>
    </div>

    <div id="bottom-nav-container"></div>
    <div id="sheets-container"></div>

    <script type="module" src="../js/costings/index.js"></script>
    <script src="../js/utils/sheet.js"></script>
    <script src="../js/app.js"></script>
</body>
</html>

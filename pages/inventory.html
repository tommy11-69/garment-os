<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Garment OS - Inventory</title>
    
    <!-- Zero-Flicker Dark Mode Theme Resolver & Global Handler -->
    <script>
      (function() {
        if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
        window.toggleTheme = window.toggleTheme || function() {
          const isDark = document.documentElement.classList.toggle('dark');
          localStorage.setItem('theme', isDark ? 'dark' : 'light');
          if (typeof window.updateThemeToggleUI === 'function') {
            window.updateThemeToggleUI(isDark);
          }
          window.dispatchEvent(new CustomEvent('gos-theme-changed', { detail: { isDark } }));
        };
      })();
    </script>
    
    <!-- Favicon & PWA Icons -->
    <link rel="icon" type="image/png" sizes="192x192" href="../assets/icon-192.png">
    <link rel="icon" type="image/webp" href="../assets/logo-primary.webp">
    <link rel="apple-touch-icon" sizes="180x180" href="../assets/apple-touch-icon.png">
    <link rel="manifest" href="../manifest.json">
    <meta name="theme-color" content="#0059b5">
    <meta name="mobile-web-app-capable" content="yes">
    
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com" rel="preconnect"/>
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
    
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script src="../js/tailwind.config.js"></script>
    
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/typography.css">
    <link rel="stylesheet" href="../css/utilities.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>
<body class="font-body text-body antialiased bg-background dark:bg-slate-950 text-on-surface dark:text-slate-100">

    <div id="topbar-container"></div>

    <div class="mobile-wrapper">
        <main id="main-content-area" class="flex-1 p-md flex flex-col gap-4">
            
            <!-- Page Header with Quick Actions -->
            <div class="px-xs pt-sm flex justify-between items-start">
                <div>
                    <h2 class="text-[28px] leading-tight font-extrabold tracking-tight text-on-surface dark:text-white">Inventory</h2>
                    <p id="inventory-subtext" class="text-[13px] text-secondary dark:text-slate-400 font-medium mt-0.5">Live Stock Valuation & Garment Raw Materials</p>
                </div>
                <div class="flex gap-2">
                    <button onclick="window.openStockInModal()" class="px-3 py-2 rounded-xl bg-primary/10 text-primary border border-primary/20 text-[12px] font-bold active-scale transition-apple flex items-center gap-1 cursor-pointer">
                        <span class="material-symbols-outlined text-[16px]">add_circle</span>
                        Stock In
                    </button>
                    <button onclick="window.openStockOutModal()" class="px-3 py-2 rounded-xl bg-surface-container dark:bg-slate-800 border border-outline-variant dark:border-slate-700 text-on-surface dark:text-slate-200 text-[12px] font-bold active-scale transition-apple flex items-center gap-1 cursor-pointer">
                        <span class="material-symbols-outlined text-[16px] text-[#FF9500]">outbox</span>
                        Issue
                    </button>
                </div>
            </div>
            
            <!-- 4-KPI Overview Dashboard Strip -->
            <div class="grid grid-cols-2 sm:grid-cols-4 gap-2.5">
                <div class="bg-surface-container-lowest p-3.5 rounded-2xl border border-outline-variant/60 shadow-xs flex flex-col justify-between">
                    <span class="text-[10px] font-bold text-secondary dark:text-slate-400 uppercase tracking-wider flex items-center gap-1">
                        <span class="material-symbols-outlined text-[14px] text-primary">account_balance_wallet</span>
                        Stock Valuation
                    </span>
                    <span id="kpi-valuation" class="text-[19px] font-extrabold text-primary leading-tight mt-1">₹ 0.00</span>
                    <span class="text-[10px] text-secondary dark:text-slate-400 mt-0.5 font-medium">Total tied-up capital</span>
                </div>

                <div class="bg-surface-container-lowest p-3.5 rounded-2xl border border-outline-variant/60 shadow-xs flex flex-col justify-between">
                    <span class="text-[10px] font-bold text-secondary dark:text-slate-400 uppercase tracking-wider flex items-center gap-1">
                        <span class="material-symbols-outlined text-[14px] text-[#00C7BE]">category</span>
                        Active SKUs
                    </span>
                    <span id="kpi-skus" class="text-[19px] font-extrabold text-on-surface dark:text-white leading-tight mt-1">0 Items</span>
                    <span class="text-[10px] text-secondary dark:text-slate-400 mt-0.5 font-medium">8 Garment categories</span>
                </div>

                <div role="button" tabindex="0" onclick="window.setInventoryStatusFilter('Low Stock')" class="bg-surface-container-lowest p-3.5 rounded-2xl border border-outline-variant/60 shadow-xs flex flex-col justify-between active-scale transition-apple cursor-pointer hover:border-[#FF9F0A]/50">
                    <span class="text-[10px] font-bold text-[#FF9F0A] uppercase tracking-wider flex items-center gap-1">
                        <span class="material-symbols-outlined text-[14px]">warning</span>
                        Low Stock Alerts
                    </span>
                    <span id="kpi-low-stock" class="text-[19px] font-extrabold text-[#FF9F0A] leading-tight mt-1">0 Items</span>
                    <span class="text-[10px] text-secondary dark:text-slate-400 mt-0.5 font-medium">Below reorder point</span>
                </div>

                <div role="button" tabindex="0" onclick="window.setInventoryStatusFilter('Out of Stock')" class="bg-surface-container-lowest p-3.5 rounded-2xl border border-outline-variant/60 shadow-xs flex flex-col justify-between active-scale transition-apple cursor-pointer hover:border-error/50">
                    <span class="text-[10px] font-bold text-error uppercase tracking-wider flex items-center gap-1">
                        <span class="material-symbols-outlined text-[14px]">error</span>
                        Out of Stock
                    </span>
                    <span id="kpi-out-stock" class="text-[19px] font-extrabold text-error leading-tight mt-1">0 Items</span>
                    <span class="text-[10px] text-secondary dark:text-slate-400 mt-0.5 font-medium">Require immediate order</span>
                </div>
            </div>

            <!-- Search Bar & Sort Dropdown -->
            <div class="flex gap-2 w-full">
                <div class="relative flex-1">
                    <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant dark:text-slate-400 text-[20px]">search</span>
                    <input id="inventory-search" class="w-full bg-surface-container-lowest border border-outline-variant rounded-2xl py-3 pl-12 pr-4 font-body text-[15px] text-on-surface placeholder:text-on-surface-variant dark:placeholder:text-slate-500 focus:outline-none focus:ring-2 focus:ring-primary/20 transition-apple shadow-xs" placeholder="Search item, SKU, category, bay, vendor..." type="text"/>
                </div>
                <div class="relative">
                    <select id="inventory-sort-select" onchange="window.setInventorySort(this.value)" class="h-[48px] bg-surface-container-lowest border border-outline-variant rounded-2xl px-3 font-body text-[13px] font-semibold text-on-surface focus:outline-none focus:ring-2 focus:ring-primary/20 transition-apple shadow-xs appearance-none pr-8 cursor-pointer">
                        <option value="newest">Newest</option>
                        <option value="highest-value">Highest Value</option>
                        <option value="lowest-stock">Lowest Stock First</option>
                        <option value="highest-stock">Highest Stock</option>
                        <option value="name">Name (A-Z)</option>
                    </select>
                    <span class="material-symbols-outlined absolute right-2.5 top-1/2 -translate-y-1/2 text-secondary dark:text-slate-400 pointer-events-none text-[18px]">expand_more</span>
                </div>
            </div>

            <!-- Status Segmented Control (All / In Stock / Low Stock / Out of Stock) -->
            <div class="flex p-1 bg-surface-container dark:bg-slate-900 rounded-[16px] border border-outline-variant/50 dark:border-slate-800">
                <button data-status-filter="All" class="flex-1 py-2 rounded-[12px] text-[13px] font-semibold bg-surface-container-lowest dark:bg-slate-800 text-on-surface dark:text-white shadow-xs transition-all cursor-pointer touch-manipulation" onclick="window.setInventoryStatusFilter('All')">All</button>
                <button data-status-filter="In Stock" class="flex-1 py-2 rounded-[12px] text-[13px] font-semibold text-secondary dark:text-slate-400 transition-all cursor-pointer touch-manipulation" onclick="window.setInventoryStatusFilter('In Stock')">In Stock</button>
                <button data-status-filter="Low Stock" class="flex-1 py-2 rounded-[12px] text-[13px] font-semibold text-secondary dark:text-slate-400 transition-all cursor-pointer touch-manipulation" onclick="window.setInventoryStatusFilter('Low Stock')">⚠️ Low Stock</button>
                <button data-status-filter="Out of Stock" class="flex-1 py-2 rounded-[12px] text-[13px] font-semibold text-secondary dark:text-slate-400 transition-all cursor-pointer touch-manipulation" onclick="window.setInventoryStatusFilter('Out of Stock')">Out of Stock</button>
            </div>

            <!-- Garment Categories Horizontal Filter Chips -->
            <div class="flex items-center gap-1.5 overflow-x-auto no-scrollbar py-1 -mx-md px-md" id="inventory-category-chips">
                <button type="button" data-category-filter="All" onclick="window.setInventoryCategoryFilter('All')"
                    class="px-3.5 py-1.5 rounded-xl text-[12px] font-bold border transition-all shrink-0 bg-primary text-white border-primary cursor-pointer touch-manipulation shadow-xs">
                    All Items
                </button>
                <button type="button" data-category-filter="Fabric" onclick="window.setInventoryCategoryFilter('Fabric')"
                    class="px-3.5 py-1.5 rounded-xl text-[12px] font-bold border transition-all shrink-0 bg-surface-container-lowest text-secondary border-outline-variant cursor-pointer touch-manipulation">
                    🧵 Fabric
                </button>
                <button type="button" data-category-filter="Rib" onclick="window.setInventoryCategoryFilter('Rib')"
                    class="px-3.5 py-1.5 rounded-xl text-[12px] font-bold border transition-all shrink-0 bg-surface-container-lowest text-secondary border-outline-variant cursor-pointer touch-manipulation">
                    🪡 Rib & Collars
                </button>
                <button type="button" data-category-filter="Yarn" onclick="window.setInventoryCategoryFilter('Yarn')"
                    class="px-3.5 py-1.5 rounded-xl text-[12px] font-bold border transition-all shrink-0 bg-surface-container-lowest text-secondary border-outline-variant cursor-pointer touch-manipulation">
                    🧶 Yarn
                </button>
                <button type="button" data-category-filter="Stitching Cones" onclick="window.setInventoryCategoryFilter('Stitching Cones')"
                    class="px-3.5 py-1.5 rounded-xl text-[12px] font-bold border transition-all shrink-0 bg-surface-container-lowest text-secondary border-outline-variant cursor-pointer touch-manipulation">
                    🧵 Stitching Cones
                </button>
                <button type="button" data-category-filter="Patterns" onclick="window.setInventoryCategoryFilter('Patterns')"
                    class="px-3.5 py-1.5 rounded-xl text-[12px] font-bold border transition-all shrink-0 bg-surface-container-lowest text-secondary border-outline-variant cursor-pointer touch-manipulation">
                    📐 Patterns & Markers
                </button>
                <button type="button" data-category-filter="Trims & Accessories" onclick="window.setInventoryCategoryFilter('Trims & Accessories')"
                    class="px-3.5 py-1.5 rounded-xl text-[12px] font-bold border transition-all shrink-0 bg-surface-container-lowest text-secondary border-outline-variant cursor-pointer touch-manipulation">
                    🏷️ Trims & Labels
                </button>
                <button type="button" data-category-filter="Packaging" onclick="window.setInventoryCategoryFilter('Packaging')"
                    class="px-3.5 py-1.5 rounded-xl text-[12px] font-bold border transition-all shrink-0 bg-surface-container-lowest text-secondary border-outline-variant cursor-pointer touch-manipulation">
                    📦 Packaging
                </button>
                <button type="button" data-category-filter="Finished Goods" onclick="window.setInventoryCategoryFilter('Finished Goods')"
                    class="px-3.5 py-1.5 rounded-xl text-[12px] font-bold border transition-all shrink-0 bg-surface-container-lowest text-secondary border-outline-variant cursor-pointer touch-manipulation">
                    👕 Ready Blank Tees
                </button>
            </div>

            <!-- Inventory Items List -->
            <div id="inventory-list" class="flex flex-col gap-3 min-h-[250px]">
                <!-- Cards injected by index.js -->
            </div>
            
            <div class="h-10"></div>
        </main>
    </div>
    
    <!-- FAB: Add Item -->
    <div id="fab-container" data-icon="add" data-action="window.openCreateItemSheet()"></div>

    <!-- Bottom Nav -->
    <div id="bottom-nav-container"></div>
    
    <!-- Sheets Container -->
    <div id="sheets-container"></div>
    
    <!-- Scripts -->
    <script src="../js/app.js"></script>
    <script type="module" src="../js/inventory/index.js?v=5.2"></script>
    <script src="../js/utils/sheet.js"></script>
</body>
</html>

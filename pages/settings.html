<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
    <title>Garment OS - Settings</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com" rel="preconnect"/>
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script src="../js/tailwind.config.js"></script>
    
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/typography.css">
    <link rel="stylesheet" href="../css/utilities.css">
</head>
<body class="font-body text-body antialiased bg-surface">

    <div class="mobile-wrapper min-h-screen flex flex-col">
        <!-- Top App Bar -->
        <header class="h-[64px] flex items-center px-4 shrink-0 bg-surface z-10 sticky top-0 border-b border-outline-variant/30">
            <button onclick="window.history.back()" class="w-10 h-10 rounded-full flex items-center justify-center hover:bg-surface-variant active:bg-surface-variant/80 transition-colors mr-2">
                <span class="material-symbols-outlined text-[24px] text-on-surface">arrow_back</span>
            </button>
            <h1 class="text-[20px] font-semibold text-on-surface">Account Settings</h1>
        </header>

        <main class="flex-1 p-md flex flex-col gap-lg pb-24">
            
            <div class="bg-surface-container-lowest rounded-[24px] border border-outline-variant shadow-sm overflow-hidden p-6">
                <h3 class="text-[17px] font-semibold text-on-surface mb-6">Update Credentials</h3>
                
                <form id="settings-form" class="flex flex-col gap-5">
                    
                    <div class="flex flex-col gap-1.5">
                        <label class="text-[13px] font-semibold text-on-surface-variant">New Username</label>
                        <input id="new-username" type="text" class="w-full bg-white border border-outline-variant rounded-2xl px-4 py-3 text-[15px] outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all" placeholder="Enter new username (optional)"/>
                    </div>

                    <hr class="border-outline-variant/50 my-2">

                    <div class="flex flex-col gap-1.5">
                        <label class="text-[13px] font-semibold text-on-surface-variant">New Password</label>
                        <input id="new-password" type="password" class="w-full bg-white border border-outline-variant rounded-2xl px-4 py-3 text-[15px] outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all" placeholder="Enter new password (optional)"/>
                    </div>

                    <div class="flex flex-col gap-1.5">
                        <label class="text-[13px] font-semibold text-on-surface-variant">Confirm New Password</label>
                        <input id="confirm-password" type="password" class="w-full bg-white border border-outline-variant rounded-2xl px-4 py-3 text-[15px] outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all" placeholder="Confirm new password"/>
                        <p id="password-error" class="text-[12px] text-error hidden mt-1">Passwords do not match.</p>
                    </div>

                    <button type="submit" id="save-btn" class="w-full mt-4 bg-primary text-white font-semibold text-[15px] rounded-2xl py-3.5 hover:bg-primary/90 active:scale-[0.98] transition-all flex items-center justify-center gap-2">
                        <span class="material-symbols-outlined text-[18px]">save</span>
                        Save Changes
                    </button>
                    
                </form>
            </div>
            
        </main>
    </div>

    <!-- Toast Container -->
    <div id="toast-container" class="fixed top-4 left-1/2 -translate-x-1/2 z-[100] flex flex-col gap-2 pointer-events-none w-full max-w-[340px] px-4"></div>

    <script src="../js/app.js"></script>
    <script type="module" src="../js/settings/index.js"></script>
</body>
</html>
